[build-system]
# 77 for the SPDX `license` expression and `license-files` (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-d-validate"
dynamic = ["version"]  # src/llmdv/__init__.py's __version__, the one place it is written
description = "Functional validation for deployed llm-d model serving stacks: the gateway, the router and the engine"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The llm-d Authors" }]
keywords = ["llm-d", "llm", "inference", "validation", "testing"]
# Python versions: only those CI's offline-tests matrix runs.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pytest>=8",
    "pyyaml>=6",
    "httpx>=0.27",
    "jsonschema>=4.18",  # Includes rpds-py, a compiled extension, via referencing.
    # Pinned exactly on purpose: these stand in for what a real client ships, and a
    # floating range would make an SDK-compatibility result meaningless. The LiteLLM
    # 1.81.9 -> 1.102.0 reasoning-delta divergence is the precedent.
    "openai==3.11.0",
    "anthropic==1.11.0",
]

[project.optional-dependencies]
# Publishing to S3 or an S3-compatible store with AWS-style credentials, which is also how
# IBM COS is reached with HMAC keys. 1.36 is the floor for the checksum settings in
# llmdv/output/s3.py.
s3 = ["boto3>=1.36"]
# Only for LLMDV_S3_AUTH=ibm-iam, which authenticates with an IAM API key instead. Separate from
# `s3` because ibm-cos-sdk is a boto3 fork of comparable size and `llmdv/output/ibm_cos.py` is
# the only module that imports it -- an AWS-credentialled install should not carry it.
ibm-cos = ["ibm-cos-sdk>=2.16.2"]
# Keep Ruff in sync with the version pinned in ../.pre-commit-config.yaml. pytest-xdist runs
# llmdv's own offline tests in parallel (`pytest tests -n auto`); it is only for developers, and
# `llmdv verify` blocks it, so live verification stays serial wherever it is installed.
dev = ["ruff==0.16.9", "pre-commit>=4.1", "pytest-xdist>=3.6"]

[project.urls]
Homepage = "https://llm-d.ai"
Documentation = "https://github.com/llm-d-incubation/llm-d-validate/blob/main/docs/manual.md"
Repository = "https://github.com/llm-d-incubation/llm-d-validate"
Issues = "https://github.com/llm-d-incubation/llm-d-validate/issues"
Releases = "https://github.com/llm-d-incubation/llm-d-validate/releases"

[project.scripts]
llmdv = "llmdv.cli.main:main"

[project.entry-points.pytest11]
llmdv = "llmdv.plugin"

[tool.setuptools.dynamic]
version = { attr = "llmdv.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llmdv = ["suites/**/*.py", "evidence/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# T20 bans print(): all output goes through the logger tree. See llmdv/log/setup.py.
select = ["E", "F", "W", "I", "T20", "B", "UP"]
