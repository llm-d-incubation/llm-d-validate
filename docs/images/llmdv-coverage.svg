<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 548" width="1440" height="548" role="img" aria-labelledby="t d">
<title id="t">What llmdv tests</title>
<desc id="d">Nineteen test suites in four groups, each with its pytest marker: API surfaces, model behaviour, failure and resilience, contract and change. Every case runs per layer: gateway, router, engine.</desc>
