# The profile smoke-step.sh runs for each overlay a guide's nightly workflows deploy (the path
# under guides/<guide>/modelserver/). An overlay that is not listed has no profile and is
# skipped. Each guide here says exactly what its README's "Pick your profile" table says, which
# tests/test_llmd_overlays.py enforces; to choose a profile yourself, read that table.
#
# <guide>: {<overlay>: <profile file under profiles/llm-d/<guide>/, without .yaml>}
optimized-baseline:
  gpu/vllm/base: vllm-qwen3-32b-parsers-standalone
  gpu/vllm/gke: vllm-qwen3-32b-parsers-standalone
  gpu/vllm/ocp: vllm-qwen3-32b-parsers-standalone
  amd/vllm/amd-ci: vllm-qwen3-32b-inline-standalone
  tpu/v5p/vllm: vllm-qwen3-32b-inline-standalone
  xpu/vllm: vllm-qwen3-0.6b-inline-standalone
  gpu/sglang/gke: sglang-qwen3-32b-parsers-standalone
  tpu/v5p/sglang: sglang-qwen3-32b-ctx16k-parsers-standalone
  amd/sglang/amd-ci: sglang-qwen3-32b-inline-standalone
  amd/atom/amd-ci: atom-qwen3-32b-ctxunknown-inline-standalone
