# The profile deploy/llm-d-nightly/smoke-step.sh runs on each llm-d nightly lane, keyed as the
# step finds it: the lane's scenario (LLMDBENCH_CICD_SCENARIO) and its overlay (accelerator,
# backend, connector, offloading target and provider, joined with / and empty ones dropped).
# A scenario or overlay that is not listed has no profile and is skipped.
#
# Each row repeats its lane's row in the guide README's maintainers' table (profile and
# identity flags), and every lane a README lists is either here or under not_run, which
# tests/test_llmd_overlays.py enforces. To choose a profile yourself, read the guide's README.
lanes:
  fast-model-actuation:
    gpu/vllm/gke:
      lane: fast-model-actuation-gke-acc-gpu-vllm-x
      profile: fast-model-actuation/vllm-qwen3-0.6b-inline-standalone
      identity: [accelerator=gpu, provider=gke]
    gpu/vllm/ocp:
      lane: fast-model-actuation-ibm-acc-gpu-vllm-x
      profile: fast-model-actuation/vllm-qwen3-0.6b-inline-standalone
