# For whatever runs trigger.sh. Unbound: the overlay binds it to the caller's identity.
# Permissions: get CronJobs, create Jobs and create per-run profile ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llmdv-trigger
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create]
