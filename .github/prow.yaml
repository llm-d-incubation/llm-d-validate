# Configuration for the GitHub prow action: https://github.com/cncf/prow-github-actions
labels:
  kind:
    - 'bug'
    - 'security'
    - 'feature'
    - 'docs'

  priority:
    - 'p0'
    - 'p1'
    - 'p2'

# The PR author does not approve their own PR; another approver in OWNERS must /approve.
approve:
  require_self_approval: true
