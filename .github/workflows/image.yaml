# Builds the runner image from the Containerfile and publishes it to
# ghcr.io/llm-d-incubation/llm-d-validate:
#
#   push to main      :main and :sha-<short sha>
#   tag vX.Y.Z        :vX.Y.Z and :latest
#   pull request      builds and smoke-tests both architectures; pushes nothing
# Release tags use the same admin, main ancestry and package-version checks as PyPI.
#
# It logs in with the workflow's own GITHUB_TOKEN, scoped by `packages: write` to this
# repository's package for this run only, so no long-lived registry secret is involved.
# Each pushed image carries an SBOM and a provenance attestation and is signed keylessly with
# cosign, the signer being this workflow's identity.
#
# Verify a pulled image:
#   cosign verify ghcr.io/llm-d-incubation/llm-d-validate:<tag> \
#     --certificate-identity-regexp 'https://github.com/llm-d-incubation/llm-d-validate/.github/workflows/image.yaml@.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Containerfile
      - pyproject.toml
      - requirements.lock
      - README.md
      - LICENSE
      - .dockerignore
      - .containerignore
      - profiles/examples/**
      - src/**
      - .github/workflows/image.yaml
      - .github/scripts/check-release.sh
      - .github/scripts/smoke-image.sh
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref replaces a build still in progress; tags never share a group.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write    # push to this repository's package
      id-token: write    # keyless cosign signing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authorize release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/check-release.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Load each platform separately for Docker's local image store. The final
      # multi-platform build reuses this builder's layers after both tests pass.
      - name: Build amd64 for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          build-args: LLMDV_GIT_SHA=${{ github.sha }}
          load: true
          tags: llmdv-smoke:amd64
      - name: Build arm64 for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64
          build-args: LLMDV_GIT_SHA=${{ github.sha }}
          load: true
          tags: llmdv-smoke:arm64
      - name: Smoke-test both platforms offline
        run: |
          bash .github/scripts/smoke-image.sh llmdv-smoke:amd64 linux/amd64
          bash .github/scripts/smoke-image.sh llmdv-smoke:arm64 linux/arm64

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=pr

      - name: Build, and push unless this is a pull request
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          build-args: LLMDV_GIT_SHA=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v3
        if: github.event_name != 'pull_request'

      - name: Sign the pushed image
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published ${IMAGE}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Tags:"
            # shellcheck disable=SC2016 # literal markdown backticks
            printf '%s\n' "$TAGS" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"
