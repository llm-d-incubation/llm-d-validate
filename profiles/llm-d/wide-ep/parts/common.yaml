# Part: what every wide-ep profile shares. Not a profile on its own; a combination file beside
# this folder lists it last in `extends`. Never extends anything.
#
# G = guides/wide-ep, R = guides/recipes, at llm-d 9ca8ff0. The router claims this guide shares
# with optimized-baseline (error envelopes, header handling, the six HTTP APIs, streaming
# pass-through, the standalone endpoint) are mapped in ../../optimized-baseline/parts/common.yaml
# and land on the same cases here; only what differs or matters for wide-ep is listed below.
#
# No `name` here: each combination names itself.

#
# The router, as this guide configures it (FROM values):
#   gpu, amd        G/router/wide-ep.values.yaml (amd.values.yaml restates the same plugin config
#                   with the AMD DisaggregatedSet's selector): disaggregatedset-rollout-screener
#                   (Alpha, hence allow-experimental-plugins: true), always-disagg-pd-decider,
#                   disagg-profile-handler; profile `prefill` = prefill-filter, prefix-cache-scorer
#                   3, queue-scorer 2, active-request-scorer 2; profile `decode` = decode-filter,
#                   active-request-scorer. gpu targets the eight DP rank ports 8000-8007; amd
#                   targets port 8000 only
#   xpu             G/router/xpu.values.yaml: aggregated, one `default` profile =
#                   prefix-cache-affinity-filter, token-load-scorer (with approx-prefix-cache-producer
#                   and inflight-load-producer), as optimized-baseline; port 8200
#   shared          R/router/base.values.yaml; G/router/wide-ep.values.yaml maps Service port 80
#                   to 8081, as optimized-baseline does. No configuration names an SLO admission
#                   plugin, so the topology part's `ignored` SLO headers stand.
# None of this changes what a client sees from optimized-baseline's router: the same listener,
# the same APIs, the same headers. P/D disaggregation and DP-rank routing are invisible in a
# response.
#
# The P/D path a request takes on gpu and amd (FROM values): the router picks a prefill rank and
# a decode pod; the decode pod's routing sidecar (llm-d-router-disagg-sidecar) runs the prefill
# remotely, then decodes locally. gpu: sidecar --port=8000 --data-parallel-size=8
# --kv-connector=nixlv2 --enable-prefiller-sampling in front of decode vLLM on 8200-8207, NIXL
# with kv_load_failure_policy "fail" (a failed KV load fails the request rather than recomputing,
# so a transfer fault reaches the client as an error). amd: sidecar --port=8000
# --model-server-port=8200 with MoRI-IO write mode, decode vLLM on 8200 with --api-server-count 8.
# Whether the sidecar disaggregates or simply passes through /v1/messages, /v1/responses and
# /v1/messages/count_tokens is not stated by any source here; the first run shows what each
# answers. xpu has no sidecar and no P/D.
#
# Block sizes, for when the cache suite or routing.prefix_affinity can use them (FROM values):
#   amd             engine --block-size 16, prefix caching OFF (--no-enable-prefix-caching)
#   xpu             engine --block-size 64
#   gpu             the engine default
# None is declared as cache_reuse.block_size, because cache_reuse is not declared (below).
#
# The guide's claims (G/README.md and G/guide.yaml verify) and where each one lands:
#   1   /v1/completions answers 200 (verify.tests.request)
#       -> openai_completions.* and discovery.models_lists_declared_model
#   2   32 requests, 8 concurrent, distinct ~1k-token prompts, all answer 200
#       (verify.tests.dp_requests) -> functionally, each request is a plain completion already
#       covered by 1; the concurrent batch itself is NOT COVERED: it needs load mode (#23)
#   3   requests spread across DP ranks, and every request disaggregated with its KV transferred
#       to a decode rank (verify.tests.rank_metrics: vllm:request_success_total and
#       vllm:external_prefix_cache_hits_total per rank, read through the API-server proxy from
#       pods labeled for the guide) -> NOT COVERED: needs per-pod, per-port metric reads, which
#       need cluster access a committed profile does not carry, and a routing case family that
#       compares counters before and after (#27)
#   4   the router's P/D decisions (verify.tests.router_metrics, llm_d_epp_disagg_decision_total,
#       only with MONITORING=true) -> NOT COVERED: fleet.metrics, same reason; no lane sets
#       MONITORING
#   5   rollout gating keeps prefill and decode on one DisaggregatedSet revision -> NOT COVERED:
#       needs a rollout during the run, which llmdv never causes
#   6   each accelerator serves exactly one model
#       -> discovery.models_lists_declared_model, discovery.unknown_model_no_fallback
#   7   context limits per overlay -> long_context.*, unhappy.context_overflow via
#       model.max_model_len (model parts)
#   8   R1's tool calling through vLLM's R1 template, with no reasoning parser (gpu overlay
#       comment) -> model.tools and model.reasoning in deepseek-r1-0528-tools.yaml, the parser
#       name in the combination; tools.* and the tool contract parts
#   9   per-rank and per-role engine metrics, KV transfer health, the EPP's per-port scheduling
#       counters (README "Key metrics for this path") -> NOT COVERED: an engine-metrics contract
#       and cluster access
#   10  replica counts, DP/TP/EP sizes, prefill and decode settings agree -> fleet.config rules,
#       which need cluster access

guide: wide-ep

capabilities:
  # Not declared, on purpose. The cache suite reads cached_tokens from each response, and no
  # overlay of this guide asks an engine to report it: none passes vLLM's
  # --enable-prompt-tokens-details (FROM values: G/modelserver/, every overlay rendered). The
  # amd overlay also turns prefix caching off. With no cached_tokens, `affinity: routed` would
  # fail on a correct stack for want of the field, not for want of affinity.
  cache_reuse: null

# The cases this guide's lanes run by default (`llmdv verify --all` runs everything). They test
# what a lane's own deployment can get wrong: the router path, the overlay's parsers and window,
# and what this guide changes. Engine and model conformance, the rest of the suite, depends only
# on the engine build, model and flags, which many lanes share; it runs with `--all` once per
# configuration (profiles/llm-d/README.md, "Which lane runs everything").
selection:
  # Every lane: the router serves each API a client uses, and refuses what it should.
  - contract.*
  - discovery.models_lists_declared_model
  - discovery.unknown_model_no_fallback
  - discovery.models_parses_with_openai_sdk
  - openai_chat.basic_non_streaming
  - openai_chat.streaming_sse
  - openai_chat.stop_reason
  - openai_completions.basic_non_streaming
  - openai_completions.streaming_matches_json
  - openai_completions.stop_reason
  - anthropic_messages.basic_non_streaming
  - anthropic_messages.streaming_sse
  - openai_responses.basic_non_streaming
  - openai_responses.streaming_sse
  - streaming.sse_framing
  - unhappy.unknown_path
  - unhappy.malformed_json
  - unhappy.missing_model
  - unhappy.wrong_method
  - unhappy.error_envelope_fields
  - transport.connection
  - transport.health_status
  # Every lane: the overlay's parser flags take effect (skips where the model part has none).
  - openai_chat.configured_reasoning
  - tools.auto_call
  - tools.auto_stream
  # Every lane: the overlay's context window is the one declared.
  - long_context.*
  - unhappy.context_overflow
  - unhappy.token_limit_over_context
  # This guide: every request passes the routing sidecar, and the guide's own check sends concurrent
  # requests.
  - openai_completions.prompt_forms
  - streaming.*
  - unhappy.invalid_token_limit
  - unhappy.streaming_validation
  - scenarios.cancel_burst
