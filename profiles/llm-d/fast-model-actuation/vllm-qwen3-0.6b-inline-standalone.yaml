# The fast-model-actuation guide in standalone mode (the client reaches the EPP's own listener):
# vLLM, run by the FMA launcher and reached through the FMA requester's TCP proxy, serving
# Qwen/Qwen3-0.6B with no parsers: inline <think>, no tool calls.
#
# Validate your deployment after installing the guide in standalone mode (guide.yaml deploy.standalone
# and deploy.modelserver, through the requester rollout):
#   export LLMDV_ROUTER_URL='https://your-router.example' # replace with your router URL
#   llmdv profile validate profiles/llm-d/fast-model-actuation/vllm-qwen3-0.6b-inline-standalone.yaml
#   llmdv verify --profile profiles/llm-d/fast-model-actuation/vllm-qwen3-0.6b-inline-standalone.yaml \
#     --identity accelerator=gpu --identity provider=<INFRA_PROVIDER>
#
# llm-d 9ca8ff0. Composed from the guide's shipped config and the API
# references. Only the router layer has been measured (on kind, with a simulator engine; see
# ../parts/topology/standalone.yaml).
#
# Maintainer provenance: upstream workflows for this configuration (llm-d's nightly-e2e-fast-model-actuation-<workflow-suffix>
# workflows; each runs in standalone mode, gateway_class epponly):
#   gke-acc-gpu-vllm-x                INFRA_PROVIDER=gke: platform/gke (modelserver/ plus the GKE
#                                     component: privileged launcher with the host driver tree,
#                                     GKE node labels and taint toleration)
#   ibm-acc-gpu-vllm-x                INFRA_PROVIDER=ocp: platform/ocp (modelserver/ as-is, on the
#                                     `nvidia` RuntimeClass)
# Both apply the same InferenceServerConfig (`--model Qwen/Qwen3-0.6B --enable-sleep-mode
# --gpu-memory-utilization 0.9`) to the same launcher and requester images (v0.8.0), so they look
# the same to a client. The guide does not pin a vLLM version; the launcher image v0.8.0 is built
# on vllm-openai:v0.26.0 (FROM docs: llm-d-fast-model-actuation@v0.8.0:
# dockerfiles/Dockerfile.launcher.benchmark:1).
# Not covered: fast-model-actuation-keda (its own guide.yaml, deferred); see README.md.
#
extends:
  - ../parts/base.yaml
  - ../parts/topology/standalone.yaml
  - ../parts/engines/vllm.yaml
  - ../parts/models/qwen3-0.6b-inline.yaml
  - ../parts/sentinels/unmeasured.yaml
  - parts/common.yaml

name: fast-model-actuation-vllm-qwen3-0.6b-inline-standalone

ingresses:
  # Overrides ../parts/topology/standalone.yaml on purpose: the launcher's vLLM v0.26.0 serves
  # /v1/chat/completions/render and /v1/completions/render with no flag, and has no Messages or
  # Responses render route (FROM docs: llm-d-fast-model-actuation@v0.8.0:
  # dockerfiles/Dockerfile.launcher.benchmark:1 for the version; the --enable-scale-out gate came
  # with vLLM v0.30, vllm@v0.31.0:vllm/entrypoints/scale_out/factories.py). The EPP forwards both
  # paths to a replica. Declared here because surfaces are keyed by ingress id.
  - id: router
    surfaces: [chat_completions, completions, messages, responses, chat_render, completions_render]
