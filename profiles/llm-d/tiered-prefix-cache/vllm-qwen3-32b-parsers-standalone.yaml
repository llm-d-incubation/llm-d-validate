# The tiered-prefix-cache guide in standalone mode (the client reaches the EPP's own
# listener):
# vLLM serving Qwen/Qwen3-32B with the qwen3 reasoning parser and the hermes tool parser,
# offloading KV cache to CPU RAM through LMCache or vLLM's native OffloadingConnector.
#
# llm-d 9ca8ff0.
#
# CI lanes that deploy this configuration (llm-d's nightly-e2e-tiered-prefix-cache-<lane>
# workflows; each runs in standalone mode, gateway_class epponly):
#   cks-cpu-gpu-vllm-lmcache          gpu/vllm/lmcache-connector/cpu/base
#   cks-cpu-gpu-vllm-native           gpu/vllm/native/cpu/base
#   gke-cpu-gpu-vllm-lmcache          gpu/vllm/lmcache-connector/cpu/gke
#   gke-cpu-gpu-vllm-native           gpu/vllm/native/cpu/gke
#   ibm-cpu-gpu-vllm-lmcache          gpu/vllm/lmcache-connector/cpu/ocp
#   ibm-cpu-gpu-vllm-native           gpu/vllm/native/cpu/ocp
# (overlays as ACCELERATOR_TYPE/MODEL_SERVER/CONNECTOR/VARIANT/INFRA_PROVIDER)
# Identity flags per lane:
#   cks-cpu-gpu-vllm-lmcache          --identity accelerator=gpu --identity provider=base --identity flavor=lmcache-connector/cpu
#   cks-cpu-gpu-vllm-native           --identity accelerator=gpu --identity provider=base --identity flavor=native/cpu
#   gke-cpu-gpu-vllm-lmcache          --identity accelerator=gpu --identity provider=gke --identity flavor=lmcache-connector/cpu
#   gke-cpu-gpu-vllm-native           --identity accelerator=gpu --identity provider=gke --identity flavor=native/cpu
#   ibm-cpu-gpu-vllm-lmcache          --identity accelerator=gpu --identity provider=ocp --identity flavor=lmcache-connector/cpu
#   ibm-cpu-gpu-vllm-native           --identity accelerator=gpu --identity provider=ocp --identity flavor=native/cpu
#
# vllm-openai v0.31.0. The connector changes nothing a client sees, so the two connectors
# on one provider differ only in `flavor` (CONNECTOR/VARIANT), which keeps their runs apart.
#
# How a lane runs it, after deploying the guide in standalone mode (guide.yaml deploy.standalone)
# with one of the overlays above (GUIDE_NAME=tiered-prefix-cache):
#   export LLMDV_ROUTER_URL=<the EPP's URL>
#   llmdv profile validate profiles/llm-d/tiered-prefix-cache/vllm-qwen3-32b-parsers-standalone.yaml
#   llmdv verify --profile profiles/llm-d/tiered-prefix-cache/vllm-qwen3-32b-parsers-standalone.yaml \
#     <the lane's identity flags above>

extends:
  - ../parts/base.yaml
  - ../parts/topology/standalone.yaml
  - ../parts/engines/vllm.yaml
  - ../parts/models/qwen3-32b-parsers.yaml
  - ../parts/sentinels/unmeasured-with-tools.yaml
  - parts/common.yaml

name: tiered-prefix-cache-vllm-qwen3-32b-parsers-standalone

model:
  # FROM values: the overlays' own flag values. The model part declares the shape a
  # client sees; the names belong to the engine, so they are stated here.
  reasoning:
    parser: qwen3
    # Inferred from another deployment (vLLM 0.32 behind an llm-d router), where the field is
    # `reasoning`, and `reasoning_content` is absent. Not yet observed on this guide's vLLM
    # v0.31.0; the first run settles it.
    field: reasoning
  tools:
    parser: hermes
