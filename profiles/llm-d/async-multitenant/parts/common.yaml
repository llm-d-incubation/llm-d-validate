# Part: what every async-multitenant profile shares. Not a profile on its own; a combination file
# beside this folder lists it last in `extends`. Never extends anything.
#
# MT = guides/batch-serving/asynchronous-processing/multitenant, OB = guides/optimized-baseline,
# R = guides/recipes, at llm-d 9ca8ff0.
#
# No `name` here: each combination names itself, so each run says which one it was.

#
# What these profiles cover: only the guide's llm-d router, the router release's `<release>-epp` Service
# (`<release>` is POOL_NAME in MT/guide.yaml). The guide also deploys Redis, llm-d-async
# (chart v1.0.0, Redis sorted-set queues, quota-only values) and the router coordinator
# (llm-d-coordinator:8080), which none of these profiles reach.
#
# The router, as this guide configures it (FROM values: MT/values/router/, layered on
# R/router/base.values.yaml; the lanes pick one with FLOW_CONTROL):
#   both        feature gate flowControl; profile `default` = queue-scorer 2,
#               kv-cache-utilization-scorer 2, prefix-cache-scorer 3; concurrency-detector
#               maxConcurrency 10; maxBytes 10Gi, maxRequests 1k, defaultRequestTTL 300s; six
#               bands 100, 60, 30, 10, -5, -10 (maxRequests 500 each), round-robin fairness and
#               FCFS ordering; selects pods labeled llm-d.ai/guide=async-multitenant
#   evictable   flow-control-evictable.yaml: enableEviction true, so a blocked higher-priority
#               request cancels in-flight negative-priority requests (-5, then -10)
#   holdback    flow-control-holdback.yaml: priority-holdback-policy (Alpha, so
#               --allow-experimental-plugins), linear by rank, ceilings 1.0 down to 0.5; no
#               eviction
#   objectives  MT/manifests/objectives: reserved-interactive 100, reserved-async 60,
#               reserved-batch 30, overflow-interactive 10, overflow-async -5, overflow-batch -10
# CI-only changes (FROM values: MT/scripts/nightly-deploy-gke.sh): EPP --v=4 and EPP metrics auth
# off.
#
# The two router configurations differ only under saturation. llmdv sends one request at a time,
# so a correct stack answers every case the same way under either; the two lanes share one
# combination and are told apart with --identity flavor=evictable|holdback. Both run flow
# control, which a client sees only as the x-llm-d-flow-queue-duration-ms response header
# (declared below).
#
# The guide's claims (MT/README.md, MT/guide.yaml, .github/scripts/e2e/async-multitenant/) and
# where each one lands. Router claims it shares with optimized-baseline (surfaces, streaming
# pass-through, the EPP's error envelopes, header aliases) land as
# ../../optimized-baseline/parts/common.yaml maps them.
#   1   the router serves completions directly (the shared e2e smoke loop at <release>-epp)
#       -> openai_completions.*, openai_chat.*
#   2   requests are placed in a band by x-llm-d-inference-objective and kept fair across
#       tenants by x-llm-d-inference-fairness-id -> headers declared `consumed` in
#       ../../parts/topology/standalone.yaml, which skip as requires_load (#23)
#   3   eviction (evictable) or holdback (holdback) protects realtime traffic: bounded TTFT,
#       latency and throughput degradation at 20/80/90/100 % of capacity with an async backlog
#       (the CI validator's inference-perf experiment) -> NOT COVERED: requires_load (#23) and a
#       benchmark
#   4   async alone saturates the pool -> NOT COVERED: requires_load (#23)
#   5   an evicted request is cancelled by the router and retried by llm-d-async -> NOT COVERED:
#       requires_load (#23) and the async layer
#   6   the coordinator's x-llm-d-async-mode (passthrough, wait, enqueue) and x-llm-d-tenant
#       routing to team queues and tiers -> NOT COVERED: needs a coordinator ingress in front of
#       the router, and an enqueue and poll surface llmdv does not have
#   7   llm-d-async quota gates, tier priority and lane objective stamping from Redis queues
#       -> NOT COVERED: the queues are not an HTTP surface
#   8   llm-d-async runs with --transport=redis-sortedset (MT/guide.yaml verify.tests.transport)
#       -> NOT COVERED: a config read, fleet.config, which needs cluster access a committed
#          profile does not carry
#   9   one model, Qwen/Qwen3-32B, as optimized-baseline serves it -> model parts,
#       discovery.models_lists_declared_model, discovery.unknown_model_no_fallback

guide: async-multitenant

capabilities:
  # Not declared, on purpose, as in optimized-baseline. The cache suite reads cached_tokens from
  # each response, and the overlay both lanes render (MT/modelserver/gpu/vllm/gke, built on
  # OB/modelserver/gpu/vllm/base) does not pass vLLM's --enable-prompt-tokens-details. With no
  # cached_tokens, `affinity: routed` would fail on a correct stack for want of the field.
  cache_reuse: null

headers:
  # FROM docs: llm-d-router@main:pkg/epp/handlers/response.go:436-445 and
  # pkg/epp/metadata/consts.go:74-76, the router build guides/env.sh pins (ROUTER_EPP_VERSION
  # main). With the flowControl feature gate on, which both router values files set, the EPP adds
  # this header, the time the request waited in flow control, to the response of every request
  # flow control admits, before the first byte; without flow control it is absent. Keyed by the
  # topology part's ingress id.
  x-llm-d-flow-queue-duration-ms:
    epp: promised

# The cases this guide's lanes run by default (`llmdv verify --full-suite` runs everything). They test
# what a lane's own deployment can get wrong: the router path, the overlay's parsers and window,
# and what this guide changes. Engine and model conformance, the rest of the suite, depends only
# on the engine build, model and flags, which many lanes share; it runs with `--full-suite` once per
# configuration (profiles/llm-d/README.md, "Which lane runs everything").
test_sets:
  default:
    # Every lane: the router serves each API a client uses, and refuses what it should.
    - contract.*
    - discovery.models_lists_declared_model
    - discovery.unknown_model_no_fallback
    - discovery.models_parses_with_openai_sdk
    - openai_chat.basic_non_streaming
    - openai_chat.streaming_sse
    - openai_chat.stop_reason
    - openai_completions.basic_non_streaming
    - openai_completions.streaming_matches_json
    - openai_completions.stop_reason
    - anthropic_messages.basic_non_streaming
    - anthropic_messages.streaming_sse
    - openai_responses.basic_non_streaming
    - openai_responses.streaming_sse
    - streaming.sse_framing
    - unhappy.unknown_path
    - unhappy.malformed_json
    - unhappy.missing_model
    - unhappy.wrong_method
    - unhappy.error_envelope_fields
    - transport.connection
    - transport.health_status
    # Every lane: the overlay's parser flags take effect (skips where the model part has none).
    - openai_chat.configured_reasoning
    - tools.auto_call
    - tools.auto_stream
    # Every lane: the overlay's context window is the one declared.
    - long_context.*
    - unhappy.context_overflow
    - unhappy.token_limit_over_context
    # This guide: the router runs flow control with eviction or holdback: concurrent and cancelled
    # requests must still be served.
    - scenarios.cancel_burst
    - streaming.cancel_then_next
    - streaming.disconnect_before_output
    - openai_chat.disconnect_recovery
    - anthropic_messages.disconnect_recovery
    - openai_responses.disconnect_recovery
