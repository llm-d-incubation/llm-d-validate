# The optimized-baseline guide in standalone mode (the client reaches the EPP's own listener):
# vLLM serving Qwen/Qwen3-32B with the qwen3 reasoning parser and the hermes tool parser.
#
# STATUS: WRITTEN, NOT RUN against this engine. Composed from the guide's shipped config at
# llm-d 565373b and the API references. Only the router layer has been measured (on kind,
# with a simulator engine; see ../parts/topology/standalone.yaml).
#
# CI lanes that deploy this configuration (llm-d's nightly-e2e-optimized-baseline-<lane>
# workflows; each runs in standalone mode):
#   cks-acc-gpu-vllm-x                gpu/vllm/base
#   gke-acc-gpu-vllm-x                gpu/vllm/gke
#   ibm-acc-gpu-vllm-x                gpu/vllm/ocp (serves from a local path under the same model
#                                     id; `ocp` is not among guide.yaml's INFRA_PROVIDER values)
# The provider overlays change only node, cache and NCCL settings, so they look the same to a
# client.
#
# How a lane runs it, after deploying the guide in standalone mode (guide.yaml deploy.standalone)
# with one of the overlays above:
#   export LLMDV_EPP_URL=http://<GUIDE_NAME>-epp.<namespace>.svc.cluster.local
#   # or from outside the cluster:
#   #   kubectl port-forward -n <namespace> svc/<GUIDE_NAME>-epp 18080:80 &
#   #   export LLMDV_EPP_URL=http://localhost:18080
#   llmdv profile validate profiles/llm-d/optimized-baseline/vllm-qwen3-32b-parsers-standalone.yaml
#   llmdv verify --profile profiles/llm-d/optimized-baseline/vllm-qwen3-32b-parsers-standalone.yaml \
#     --label overlay=<ACCELERATOR_TYPE>/<MODEL_SERVER>/<INFRA_PROVIDER>

extends:
  - ../parts/base.yaml
  - ../parts/topology/standalone.yaml
  - ../parts/engines/vllm.yaml
  - ../parts/models/qwen3-32b-parsers.yaml
  - parts/common.yaml

name: optimized-baseline-vllm-qwen3-32b-parsers-standalone

model:
  # FROM values: the overlays' own flag values. The model part declares the shape a
  # client sees; the names belong to the engine, so they are stated here.
  reasoning:
    parser: qwen3
    # MEASURED on another deployment (vLLM 0.32 behind an llm-d router): the field is
    # `reasoning`, and `reasoning_content` is absent. Not yet observed on this guide's vLLM
    # v0.31.0; the first run settles it.
    field: reasoning
  tools:
    parser: hermes

capabilities:
  # Change sentinels. Their values depend on this exact stack (template, tokenizer, engine
  # build and parsers), so they live here and not in a part. INTENT: placeholders, as
  # .agents/skills/writing-an-infra-profile/SKILL.md step 6 describes. The first run with
  # --evidence all fails each pin with the observed count and records each contract
  # part's exchange; replace these with those values and cite the build.
  prompt_pins:
    chat_completions: {conversation: 1, tools: 1}
    completions: {conversation: 1}
    messages: {conversation: 1, tools: 1}
    responses: {conversation: 1, tools: 1}
  contract_baseline:
    chat_completions:
      response: {llmdv_seed: [absent]}
      stream: {llmdv_seed: [absent]}
      error: {llmdv_seed: [absent]}
      invalid: {llmdv_seed: [absent]}
      tool_response: {llmdv_seed: [absent]}
      tool_stream: {llmdv_seed: [absent]}
    completions:
      response: {llmdv_seed: [absent]}
      stream: {llmdv_seed: [absent]}
      error: {llmdv_seed: [absent]}
      invalid: {llmdv_seed: [absent]}
    messages:
      response: {llmdv_seed: [absent]}
      stream: {llmdv_seed: [absent]}
      error: {llmdv_seed: [absent]}
      invalid: {llmdv_seed: [absent]}
      tool_response: {llmdv_seed: [absent]}
      tool_stream: {llmdv_seed: [absent]}
    responses:
      response: {llmdv_seed: [absent]}
      stream: {llmdv_seed: [absent]}
      error: {llmdv_seed: [absent]}
      invalid: {llmdv_seed: [absent]}
      tool_response: {llmdv_seed: [absent]}
      tool_stream: {llmdv_seed: [absent]}
