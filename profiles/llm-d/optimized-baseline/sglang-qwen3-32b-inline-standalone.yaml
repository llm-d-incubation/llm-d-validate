# The optimized-baseline guide in standalone mode (the client reaches the EPP's own listener):
# SGLang serving Qwen/Qwen3-32B with no parsers: inline <think>, no tool calls (ROCm build).
#
# Validate your deployment after installing the guide in standalone mode (guide.yaml deploy.standalone)
# with one of the overlays listed below:
#   export LLMDV_ROUTER_URL='https://your-router.example' # replace with your router URL
#   llmdv profile validate profiles/llm-d/optimized-baseline/sglang-qwen3-32b-inline-standalone.yaml
#   llmdv verify --profile profiles/llm-d/optimized-baseline/sglang-qwen3-32b-inline-standalone.yaml \
#     --identity accelerator=<ACCELERATOR_TYPE> --identity provider=<INFRA_PROVIDER>
#
# Composed from the guide's shipped config at
# llm-d 9ca8ff0 and the API references. Only the router layer has been measured (on kind,
# with a simulator engine; see ../parts/topology/standalone.yaml).
#
# Maintainer provenance: upstream workflow for this configuration (llm-d's nightly-e2e-optimized-baseline-<workflow-suffix>
# workflow; it runs in standalone mode):
#   amd-acc-rocm-sglang-x             amd/sglang/amd-ci
# Same to a client, but run by no configuration: amd/sglang/base.
#
extends:
  - ../parts/base.yaml
  - ../parts/topology/standalone.yaml
  - ../parts/engines/sglang.yaml
  - ../parts/models/qwen3-32b-inline.yaml
  - ../parts/sentinels/unmeasured.yaml
  - parts/common.yaml

name: optimized-baseline-sglang-qwen3-32b-inline-standalone
