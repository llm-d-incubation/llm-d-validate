# The optimized-baseline guide in standalone mode (the client reaches the EPP's own listener):
# vLLM serving Qwen/Qwen3-0.6B with no parsers (an Intel XPU vLLM build).
#
# STATUS: WRITTEN, NOT RUN against this engine. Composed from the guide's shipped config at
# llm-d 9ca8ff0 and the API references. Only the router layer has been measured (on kind,
# with a simulator engine; see ../parts/topology/standalone.yaml).
#
# CI lane that deploys this configuration (llm-d's nightly-e2e-optimized-baseline-<lane>
# workflow; it runs in standalone mode):
#   intel-acc-xpu-vllm-x              xpu/vllm (the lane sets no provider, so it applies that
#                                     folder's own kustomization, which includes `base`)
#
# How a lane runs it, after deploying the guide in standalone mode (guide.yaml deploy.standalone)
# with one of the overlays above:
#   export LLMDV_EPP_URL=<the EPP's URL>
#   llmdv profile validate profiles/llm-d/optimized-baseline/vllm-qwen3-0.6b-inline-standalone.yaml
#   llmdv verify --profile profiles/llm-d/optimized-baseline/vllm-qwen3-0.6b-inline-standalone.yaml \
#     --identity accelerator=<ACCELERATOR_TYPE> --identity provider=<INFRA_PROVIDER>

extends:
  - ../parts/base.yaml
  - ../parts/topology/standalone.yaml
  - ../parts/engines/vllm.yaml
  - ../parts/models/qwen3-0.6b-inline.yaml
  - ../parts/sentinels/unmeasured.yaml
  - parts/common.yaml

name: optimized-baseline-vllm-qwen3-0.6b-inline-standalone
