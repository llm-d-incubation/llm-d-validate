# The predicted-latency-routing guide in standalone mode (the client reaches the EPP's own
# listener):
# vLLM serving Qwen/Qwen3-32B at a RoPE-scaled (YaRN, factor 3.2) 131072-token window, with
# the qwen3 reasoning parser and the hermes tool parser.
#
# STATUS: WRITTEN, NOT RUN. llm-d 9ca8ff0.
#
# CI lanes that deploy this configuration (llm-d's nightly-e2e-predicted-latency-routing-<lane>
# workflows; each runs in standalone mode, gateway_class epponly):
#   cks-acc-gpu-vllm-x                gpu/vllm/base
#   gke-acc-gpu-vllm-x                gpu/vllm/gke
#   ibm-acc-gpu-vllm-x                gpu/vllm/ocp (serves from a local path under the same model id)
#   amd-ci-acc-rocm-vllm-x            amd/vllm (the lane sets no provider, so it applies that
#                                     folder's own kustomization, which includes `base`)
# Identity flags per lane:
#   cks-acc-gpu-vllm-x                --identity accelerator=gpu --identity provider=base
#   gke-acc-gpu-vllm-x                --identity accelerator=gpu --identity provider=gke
#   ibm-acc-gpu-vllm-x                --identity accelerator=gpu --identity provider=ocp
#   amd-ci-acc-rocm-vllm-x            --identity accelerator=amd --identity provider=base
#
# Each overlay patches optimized-baseline's model server (vllm-openai v0.31.0, and the ROCm
# build on AMD) with --max-model-len=131072 and --hf-overrides; on AMD the patch also adds
# the parsers optimized-baseline's AMD overlay lacks (FROM values: modelserver/{gpu,amd}/
# vllm/base/patch-vllm.yaml). The latency predictor runs beside the EPP and changes nothing
# a client sends or receives.
#
# How a lane runs it, after deploying the guide in standalone mode (guide.yaml deploy.standalone)
# with one of the overlays above (GUIDE_NAME=predicted-latency-routing):
#   export LLMDV_EPP_URL=http://<GUIDE_NAME>-epp.<namespace>.svc.cluster.local
#   # or from outside the cluster:
#   #   kubectl port-forward -n <namespace> svc/<GUIDE_NAME>-epp 18080:80 &
#   #   export LLMDV_EPP_URL=http://localhost:18080
#   llmdv profile validate profiles/llm-d/predicted-latency-routing/vllm-qwen3-32b-ctx128k-parsers-standalone.yaml
#   llmdv verify --profile profiles/llm-d/predicted-latency-routing/vllm-qwen3-32b-ctx128k-parsers-standalone.yaml \
#     <the lane's identity flags above>

extends:
  - ../parts/base.yaml
  - ../parts/topology/standalone.yaml
  - ../parts/engines/vllm.yaml
  - ../parts/models/qwen3-32b-ctx128k-parsers.yaml
  - ../parts/sentinels/unmeasured-with-tools.yaml
  - parts/common.yaml

name: predicted-latency-routing-vllm-qwen3-32b-ctx128k-parsers-standalone

model:
  # FROM values: the overlays' own flag values. The model part declares the shape a
  # client sees; the names belong to the engine, so they are stated here.
  reasoning:
    parser: qwen3
    # Inferred from another deployment (vLLM 0.32 behind an llm-d router), where the field is
    # `reasoning`, and `reasoning_content` is absent. Not yet observed on this guide's vLLM
    # v0.31.0; the first run settles it.
    field: reasoning
  tools:
    parser: hermes
