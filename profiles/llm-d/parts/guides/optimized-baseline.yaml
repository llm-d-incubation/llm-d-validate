# Part: what the optimized-baseline guide adds. Not a profile on its own; a combination file lists
# it last in `extends`. Never extends anything.
#
# G = guides/optimized-baseline, R = guides/recipes, at llm-d 565373b.
#
# No `name` here: the guide spans many combinations (engine, model configuration and topology),
# and each run must say which one it was. The combination file names itself.
#
# The router, as this guide configures it (FROM values):
#   vLLM, SGLang, Atom   G/router/optimized-baseline.values.yaml: approx-prefix-cache-producer and
#                        inflight-load-producer; profile `default` = prefix-cache-affinity-filter,
#                        then token-load-scorer; all plugin defaults
#   TensorRT-LLM         G/router/optimized-baseline-trtllm.values.yaml: queue-scorer 2,
#                        kv-cache-utilization-scorer 2, prefix-cache-scorer 3, no-hit-lru-scorer 2;
#                        metrics from /prometheus/metrics
#   shared               R/router/base.values.yaml: one EPP replica, InferencePool failureMode
#                        FailOpen, an Envoy sidecar
# No configuration names an SLO admission plugin, which is why the topology parts declare the
# SLO headers `ignored` (they live there because llmdv keys header dispositions by ingress id).
#
# Block sizes, for when the cache suite or routing.prefix_affinity can use them. The router's
# prefix producer defaults to 64-token blocks and auto-tunes from the block size an engine
# publishes (docs/architecture/kv-management/prefix-cache-aware-routing.md):
#   tpu/v7/vllm          engine --block-size=4352; router pinned to 4352 by
#                        G/router/tpu-v7.values.yaml
#   npu/vllm             engine --block-size=4096; router pinned to 512 by
#                        G/router/npu.rbln.values.yaml (the runtime reuses 512-token sub-blocks
#                        without publishing that unit, per G/guide.yaml)
#   v7-dynamic-slice     engine 256, biren 128, iluvatar 256: no router override; auto-tune is
#                        expected to pick them up (not observed)
#   everything else      the engine default
# None is declared as cache_reuse.block_size, because cache_reuse is not declared (below).
#
# The guide's claims (G/README.md and G/guide.yaml) and where each one lands:
#   1, 2   /v1/completions answers 200, also ten times with a shared ~2k-token prefix
#          -> openai_completions.* and discovery.models_lists_declared_model
#   3      shared-prefix requests stay on one pod, with a high prefix hit rate
#          -> NOT COVERED: needs routing.prefix_affinity, sequential requests with per-pod counter
#             deltas read before and after (#27). cache_reuse cannot see it; see below.
#             MEASURED 2026-11-16 on kind (real EPP, simulator engine): ten sequential
#             shared-prefix requests all landed on one replica, by per-replica request counters
#             The guide's own check (guide.yaml verify.tests.pod_metrics, README "Verify
#             prefix-cache aware routing") reads these per-pod series through the API-server
#             proxy on port 8000, from pods labeled for the guide: vLLM
#             vllm:request_success_total and vllm:prefix_cache_{hits,queries}_total; SGLang
#             sglang:num_requests_total and sglang:cached_tokens_total{cache_source="device"}
#             (the README notes sglang:cache_hit_rate is a rolling gauge that reads 0 on some
#             builds even when hits occur)
#   4      TensorRT-LLM request spread -> same family, with TensorRT-LLM's metric names. No CI lane
#          runs TensorRT-LLM, so no profile here covers it
#   5, 6   load-aware scoring and the saturation override -> load mode (#23) or a benchmark
#   7      latency and throughput -> a benchmark, not llmdv
#   8      each accelerator serves exactly one model
#          -> discovery.models_lists_declared_model, discovery.unknown_model_no_fallback
#   9      context limits per overlay -> long_context.*, unhappy.context_overflow via
#          model.max_model_len (model parts)
#   10     reasoning and tool parsers per overlay -> model.reasoning and model.tools (model parts,
#          parser names in each combination)
#   11     engine metrics at :8000/metrics (TensorRT-LLM: /prometheus/metrics) -> NOT COVERED:
#          needs an engine layer and an engine-metrics contract. The series the README's "Key
#          metrics for this path" names, for that contract: vLLM vllm:num_requests_running,
#          vllm:num_requests_waiting, vllm:kv_cache_usage_perc, vllm:time_to_first_token_seconds,
#          vllm:inter_token_latency_seconds and the prefix-cache counters above; SGLang
#          sglang:num_running_reqs, sglang:token_usage, sglang:prompt_tokens_total
#   12     the EPP's six HTTP APIs -> contract.declared_surfaces_exist and
#          undeclared_surfaces_absent for four of them (topology parts); embeddings and
#          /inference/v1/generate need new surfaces
#   13     streaming passes through -> streaming.*, openai_completions.streaming_matches_json
#   14     x-llm-d-model-name-rewrite -> NOT COVERED; see topology/standalone.yaml
#   15     deprecated header aliases and precedence -> aliases declared in the topology parts;
#          precedence needs a new case variant
#   16     objective and fairness headers consumed -> contract.header_disposition, skips as
#          requires_load
#   17     SLO headers have no effect in this guide -> declared `ignored` in the topology parts
#   18     x-llm-d-request-dropped-reason absent on success -> topology parts; its values need load
#   19, 24 FailOpen and graceful drain -> fault injection or a rollout in CI, not llmdv
#   20     standalone endpoint `<GUIDE_NAME>-epp` on port 80 -> topology/standalone.yaml
#   21     gateway mode through `llm-d-inference-gateway` on port 80 -> NOT COVERED: no CI lane
#          runs gateway mode, and llmdv has no gateway role yet (#24). A wrong provider (503s on
#          GKE with provider none) is a CI matter
#   28     the standalone sidecar proxy can be agentgateway instead of Envoy (README, "Deploy the
#          llm-d Router") -> NOT COVERED: every CI lane uses the Envoy sidecar, and the router
#          facts in topology/standalone.yaml were measured with Envoy
#   22, 23, 25   router and engine settings agree, replica counts, sidecar args
#          -> fleet.config rules, which need cluster access a committed profile does not carry
#   26     EPP Prometheus series when MONITORING=true -> fleet.metrics, same reason
#   27     SGLang's Rust frontend on NVIDIA GPU -> contract_baseline in that combination

capabilities:
  # Not declared, on purpose. The cache suite reads cached_tokens from each response, and no
  # overlay of this guide asks an engine to report it: none passes vLLM's
  # --enable-prompt-tokens-details or SGLang's --enable-cache-report (FROM values:
  # G/modelserver/, against guides/pd-disaggregation, which does). With no cached_tokens,
  # `affinity: routed` would fail on a correct stack for want of the field, not for want of
  # affinity. The guide's own prefix-affinity claim (3 above) needs routing.prefix_affinity.
  cache_reuse: null
