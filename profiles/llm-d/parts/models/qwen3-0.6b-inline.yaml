# Part: Qwen/Qwen3-0.6B at the model's own 40960-token window, served WITHOUT reasoning or
# tool-call parsers. Not a profile on its own; a combination file lists it after the engine part.
# Never extends anything.
#
# Used by (overlays as ACCELERATOR_TYPE/MODEL_SERVER/INFRA_PROVIDER, at llm-d 9ca8ff0):
#   xpu/vllm/base               an Intel XPU vLLM build; --dtype=float16 --disable-sliding-window
#   xpu/sglang/base             an Intel XPU SGLang build; --dtype=float16
# FROM values: guides/optimized-baseline/modelserver/xpu/{vllm,sglang}/base/.
#   fast-model-actuation platform/{gke,ocp}
#                               vLLM run by the FMA launcher image v0.8.0 (the vLLM version is
#                               not pinned anywhere in the guide); --model Qwen/Qwen3-0.6B
#                               --enable-sleep-mode --gpu-memory-utilization 0.9
# FROM values: guides/fast-model-actuation/modelserver/inferenceserverconfig.yaml.
# Also used by precise-prefix-cache-routing xpu/vllm/base (the same build and flags, plus
# --enable-scale-out, --block-size=64 and KV events) and predicted-latency-routing xpu/vllm/base
# (optimized-baseline's xpu/vllm overlay, unchanged). FROM values:
# guides/{precise-prefix-cache-routing,predicted-latency-routing}/modelserver/xpu/vllm/.
#
# Excluded, and why:
#   model.tools         no tool parser
#   reasoning_tokens    without a reasoning parser the engine cannot count reasoning apart from
#                       the answer
#   answer_max_tokens   opt-in, and no source states the budget this model needs for a one-word
#                       answer with thinking on; set it from the first run's recorded usage
#   effort_rendering    no source states an effort marker in the chat template

model:
  # FROM values: the first argument of `vllm serve` and SGLang's --model-path.
  public_id: Qwen/Qwen3-0.6B
  aliases: []
  # FROM values: no overlay here sets a window. DERIVED: 40960 is max_position_embeddings in the
  # model's config.json, not a guide value; the first run's GET /v1/models confirms it.
  max_model_len: 40960
  reasoning:
    # FROM values: no --reasoning-parser in any overlay listed above.
    parser: null
    field: null
    # INTENT: without a parser, the reasoning reaches the client as a literal <think> block in
    # `content`.
    inline_tag: think
    # INTENT: Qwen3 thinks unless asked not to (its template's enable_thinking defaults to
    # true).
    default_on: true
  tools:
    # FROM values: no --tool-call-parser and no --enable-auto-tool-choice in any overlay listed
    # above, so the tool cases skip as undeclared: the parser they need does not exist here.
    parser: null
    auto_choice: false

capabilities:
  # INTENT: every effort each API defines. The API defines what an effort asks for, whatever shape
  # the reasoning arrives in. `none` is the quiet one.
  chat_reasoning_efforts: [minimal, low, medium, high, xhigh, max]
  chat_quiet_efforts: [none]
  responses_reasoning_efforts: [none, minimal, low, medium, high, xhigh, max]
  messages_thinking: [enabled, adaptive, disabled]
  messages_efforts: [low, medium, high, xhigh, max]
  # INTENT: declared accepted on a text-only model; expected to fail until the team marks it
  # (Rule 1, red flags).
  vision: [chat_completions, messages, responses]
