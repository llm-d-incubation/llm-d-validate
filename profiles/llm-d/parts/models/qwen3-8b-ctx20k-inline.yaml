# Part: Qwen/Qwen3-8B capped at a 20480-token window, served WITHOUT reasoning or tool-call
# parsers: reasoning arrives inline as a <think> block, and no tool call is parsed. Not a profile
# on its own; a combination file lists it after the engine part. Never extends anything.
#
# Used by (overlays as ACCELERATOR_TYPE/MODEL_SERVER/CONNECTOR/VARIANT/INFRA_PROVIDER, at llm-d
# 9ca8ff0):
#   tiered-prefix-cache   xpu/vllm/lmcache-connector/cpu/base   llm-d-xpu v1.0.0 (an Intel XPU
#                         vLLM build), --max-model-len 20480, --dtype bfloat16, one XPU
# FROM values: guides/tiered-prefix-cache/modelserver/xpu/vllm/lmcache-connector/cpu/base/
# patch-vllm.yaml passes no parser flag.
#
# Excluded, and why:
#   model.tools         no tool parser
#   reasoning_tokens    without a reasoning parser the engine cannot count reasoning apart from
#                       the answer
#   answer_max_tokens   opt-in, and no source states the budget this model needs for a one-word
#                       answer with thinking on; set it from the first run's recorded usage
#   effort_rendering    no source states an effort marker in the chat template

model:
  # FROM values: the first argument of `vllm serve`. FROM docs: guides/tiered-prefix-cache/
  # guide.yaml (the xpu notes and the MODEL comment) says this overlay serves Qwen/Qwen3-8B.
  public_id: Qwen/Qwen3-8B
  aliases: []
  # FROM values: --max-model-len 20480 (patch-vllm.yaml above).
  max_model_len: 20480
  reasoning:
    # FROM values: no --reasoning-parser in the overlay listed above.
    parser: null
    field: null
    # INTENT: without a parser, the reasoning reaches the client as a literal <think> block in
    # `content`.
    inline_tag: think
    # INTENT: Qwen3 thinks unless asked not to (its template's enable_thinking defaults to
    # true).
    default_on: true
  tools:
    # FROM values: no --tool-call-parser and no --enable-auto-tool-choice in the overlay listed
    # above, so the tool cases skip as undeclared: the parser they need does not exist here.
    parser: null
    auto_choice: false

capabilities:
  # INTENT: every effort each API defines. The API defines what an effort asks for, whatever shape
  # the reasoning arrives in. `none` is the quiet one.
  chat_reasoning_efforts: [minimal, low, medium, high, xhigh, max]
  chat_quiet_efforts: [none]
  responses_reasoning_efforts: [none, minimal, low, medium, high, xhigh, max]
  messages_thinking: [enabled, adaptive, disabled]
  messages_efforts: [low, medium, high, xhigh, max]
  # INTENT: declared accepted on a text-only model; expected to fail until the team marks it
  # (Rule 1, red flags).
  vision: [chat_completions, messages, responses]
