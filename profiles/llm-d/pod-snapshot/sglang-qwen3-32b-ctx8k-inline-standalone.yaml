# The pod-snapshot guide in standalone mode (the client reaches the EPP's own listener): SGLang
# serving Qwen/Qwen3-32B at an 8192-token window with no parsers: inline <think>, no tool calls.
#
# STATUS: WRITTEN, NOT RUN. llm-d 9ca8ff0. Composed from the guide's shipped config and the API
# references. Only the router layer has been measured (on kind, with a simulator engine; see
# ../parts/topology/standalone.yaml).
#
# CI lane that deploys this configuration (llm-d's nightly-e2e-pod-snapshot-<lane> workflow; it
# runs in standalone mode):
#   gke-acc-gpu-sglang-x              guides/pod-snapshot/scripts/nightly-deploy-gke.sh with
#                                     MODEL_SERVER=sglang, which applies
#                                     modelserver/gpu/sglang/gke: sglang v0.5.22 under gVisor,
#                                     one GPU per replica, --context-length 8192
#                                     --enable-memory-saver --enable-weights-cpu-backup, started
#                                     through the guide's snapshot launcher. Two replicas once the
#                                     deploy finishes: one cold started, one restored from the
#                                     snapshot
#
# How a lane runs it, after the deploy script has finished (Pod 1 snapshotted, Pod 2 restored):
#   export LLMDV_EPP_URL=http://<GUIDE_NAME>-epp.<namespace>.svc.cluster.local
#   # or from outside the cluster (forward the Service: a port-forward to a gVisor pod fails):
#   #   kubectl port-forward -n <namespace> svc/<GUIDE_NAME>-epp 18080:80 &
#   #   export LLMDV_EPP_URL=http://localhost:18080
#   llmdv profile validate profiles/llm-d/pod-snapshot/sglang-qwen3-32b-ctx8k-inline-standalone.yaml
#   llmdv verify --profile profiles/llm-d/pod-snapshot/sglang-qwen3-32b-ctx8k-inline-standalone.yaml \
#     --identity accelerator=gpu --identity provider=gke

extends:
  - ../parts/base.yaml
  - ../parts/topology/standalone.yaml
  - ../parts/engines/sglang.yaml
  - ../parts/models/qwen3-32b-ctx8k-inline.yaml
  - ../parts/sentinels/unmeasured.yaml
  - parts/common.yaml

name: pod-snapshot-sglang-qwen3-32b-ctx8k-inline-standalone
