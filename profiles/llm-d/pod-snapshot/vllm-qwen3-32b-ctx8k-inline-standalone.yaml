# The pod-snapshot guide in standalone mode (the client reaches the EPP's own listener): vLLM
# serving Qwen/Qwen3-32B at an 8192-token window with no parsers: inline <think>, no tool calls.
#
# Validate your deployment after the deploy script has finished (Pod 1 snapshotted, Pod 2 restored):
#   export LLMDV_ROUTER_URL='https://your-router.example' # replace with your router URL
#   llmdv profile validate profiles/llm-d/pod-snapshot/vllm-qwen3-32b-ctx8k-inline-standalone.yaml
#   llmdv verify --profile profiles/llm-d/pod-snapshot/vllm-qwen3-32b-ctx8k-inline-standalone.yaml \
#     --identity accelerator=gpu --identity provider=gke
#
# llm-d 9ca8ff0. Composed from the guide's shipped config and the API
# references. Only the router layer has been measured (on kind, with a simulator engine; see
# ../parts/topology/standalone.yaml).
#
# Maintainer provenance: upstream workflow for this configuration (llm-d's nightly-e2e-pod-snapshot-<workflow-suffix> workflow; it
# runs in standalone mode):
#   gke-acc-gpu-vllm-x                guides/pod-snapshot/scripts/nightly-deploy-gke.sh with
#                                     MODEL_SERVER=vllm, which applies modelserver/gpu/vllm/gke:
#                                     vllm-openai v0.31.0 under gVisor, one GPU per replica,
#                                     --max-model-len 8192 --enable-sleep-mode, started through
#                                     the guide's snapshot launcher. Two replicas once the deploy
#                                     finishes: one cold started, one restored from the snapshot
#
extends:
  - ../parts/base.yaml
  - ../parts/topology/standalone.yaml
  - ../parts/engines/vllm.yaml
  - ../parts/models/qwen3-32b-ctx8k-inline.yaml
  - ../parts/sentinels/unmeasured.yaml
  - parts/common.yaml

name: pod-snapshot-vllm-qwen3-32b-ctx8k-inline-standalone
