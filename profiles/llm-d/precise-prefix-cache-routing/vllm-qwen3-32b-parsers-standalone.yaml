# The precise-prefix-cache-routing guide in standalone mode (the client reaches the EPP's own
# listener):
# vLLM serving Qwen/Qwen3-32B with the qwen3 reasoning parser and the hermes tool parser,
# publishing KV events to the router, which renders every prompt on the pods.
#
# STATUS: WRITTEN, NOT RUN. llm-d 9ca8ff0.
#
# CI lanes that deploy this configuration (llm-d's nightly-e2e-precise-prefix-cache-routing-<lane>
# workflows; each runs in standalone mode, gateway_class epponly):
#   cks-acc-gpu-vllm-x                gpu/vllm/base
#   gke-acc-gpu-vllm-x                gpu/vllm/gke
#   ibm-acc-gpu-vllm-x                gpu/vllm/ocp (serves from a local path under the same model id)
# Identity flags per lane:
#   cks-acc-gpu-vllm-x                --identity accelerator=gpu --identity provider=base
#   gke-acc-gpu-vllm-x                --identity accelerator=gpu --identity provider=gke
#   ibm-acc-gpu-vllm-x                --identity accelerator=gpu --identity provider=ocp
#
# The provider overlays change only node, cache and model-loading settings, so they look the
# same to a client. vllm-openai v0.31.0 with --enable-scale-out, --block-size=64 and
# --kv-events-config (FROM values: modelserver/gpu/vllm/base/patch-vllm.yaml).
#
# How a lane runs it, after deploying the guide in standalone mode (guide.yaml deploy.standalone)
# with one of the overlays above (GUIDE_NAME=precise-prefix-cache-routing):
#   export LLMDV_EPP_URL=http://<GUIDE_NAME>-epp.<namespace>.svc.cluster.local
#   # or from outside the cluster:
#   #   kubectl port-forward -n <namespace> svc/<GUIDE_NAME>-epp 18080:80 &
#   #   export LLMDV_EPP_URL=http://localhost:18080
#   llmdv profile validate profiles/llm-d/precise-prefix-cache-routing/vllm-qwen3-32b-parsers-standalone.yaml
#   llmdv verify --profile profiles/llm-d/precise-prefix-cache-routing/vllm-qwen3-32b-parsers-standalone.yaml \
#     <the lane's identity flags above>

extends:
  - ../parts/base.yaml
  - ../parts/topology/standalone.yaml
  - ../parts/engines/vllm.yaml
  - ../parts/models/qwen3-32b-parsers.yaml
  - ../parts/sentinels/unmeasured-with-tools.yaml
  - parts/common.yaml

name: precise-prefix-cache-routing-vllm-qwen3-32b-parsers-standalone

model:
  # FROM values: the overlays' own flag values. The model part declares the shape a
  # client sees; the names belong to the engine, so they are stated here.
  reasoning:
    parser: qwen3
    # Inferred from another deployment (vLLM 0.32 behind an llm-d router), where the field is
    # `reasoning`, and `reasoning_content` is absent. Not yet observed on this guide's vLLM
    # v0.31.0; the first run settles it.
    field: reasoning
  tools:
    parser: hermes
