# The precise-prefix-cache-routing guide in standalone mode (the client reaches the EPP's own
# listener):
# vLLM serving Qwen/Qwen3-32B with the qwen3 reasoning parser and the hermes tool parser,
# publishing KV events to the router, which renders every prompt on the pods.
#
# Validate your deployment after installing the guide in standalone mode (guide.yaml deploy.standalone)
# with one of the overlays listed below (GUIDE_NAME=precise-prefix-cache-routing):
#   export LLMDV_ROUTER_URL='https://your-router.example' # replace with your router URL
#   llmdv profile validate profiles/llm-d/precise-prefix-cache-routing/vllm-qwen3-32b-parsers-standalone.yaml
#   llmdv verify --profile profiles/llm-d/precise-prefix-cache-routing/vllm-qwen3-32b-parsers-standalone.yaml \
#     <the matching identity flags below>
#
# llm-d 9ca8ff0.
#
# Maintainer provenance: upstream workflows for this configuration (llm-d's nightly-e2e-precise-prefix-cache-routing-<workflow-suffix>
# workflows; each runs in standalone mode, gateway_class epponly):
#   cks-acc-gpu-vllm-x                gpu/vllm/base
#   gke-acc-gpu-vllm-x                gpu/vllm/gke
#   ibm-acc-gpu-vllm-x                gpu/vllm/ocp (serves from a local path under the same model id)
# Comparison identity by deployment configuration:
#   cks-acc-gpu-vllm-x                --identity accelerator=gpu --identity provider=base
#   gke-acc-gpu-vllm-x                --identity accelerator=gpu --identity provider=gke
#   ibm-acc-gpu-vllm-x                --identity accelerator=gpu --identity provider=ocp
#
# The provider overlays change only node, cache and model-loading settings, so they look the
# same to a client. vllm-openai v0.31.0 with --enable-scale-out, --block-size=64 and
# --kv-events-config (FROM values: modelserver/gpu/vllm/base/patch-vllm.yaml).
#
extends:
  - ../parts/base.yaml
  - ../parts/topology/standalone.yaml
  - ../parts/engines/vllm.yaml
  - ../parts/models/qwen3-32b-parsers.yaml
  - ../parts/sentinels/unmeasured-with-tools.yaml
  - parts/common.yaml

name: precise-prefix-cache-routing-vllm-qwen3-32b-parsers-standalone

model:
  # FROM values: the overlays' own flag values. The model part declares the shape a
  # client sees; the names belong to the engine, so they are stated here.
  reasoning:
    parser: qwen3
    # Inferred from another deployment (vLLM 0.32 behind an llm-d router), where the field is
    # `reasoning`, and `reasoning_content` is absent. Not yet observed on this guide's vLLM
    # v0.31.0; the first run settles it.
    field: reasoning
  tools:
    parser: hermes

ingresses:
  # Overrides ../parts/topology/standalone.yaml on purpose: this configuration's engine runs with
  # --enable-scale-out (FROM values: modelserver/gpu/vllm/base/patch-vllm.yaml), and vLLM v0.30
  # and later register the four render routes only with that flag (FROM docs:
  # vllm@v0.31.0:vllm/entrypoints/scale_out/factories.py, register_scale_out_api_routers; the
  # routes in vllm/entrypoints/scale_out/render/api_router.py). Through the EPP, the router claims
  # the chat, completions and messages render routes (FROM docs: llm-d-router
  # parsers/openai/openai.go:133 and anthropic.go:69) and passes
  # /v1/responses/render through; it does not re-tokenize a client's render call (the
  # token-producer returns early for one) and routes it by model to one pod. Declared here, not
  # in parts/common.yaml, because the TPU v5p configuration's engine runs without the flag.
  - id: router
    surfaces: [chat_completions, completions, messages, responses, chat_render, completions_render, messages_render, responses_render]

capabilities:
  # INTENT: the router looks its cache up by the token prefix it renders, so a prompt that grows
  # by one turn must keep the earlier turns' tokens. A synthetic check.
  prefix_stability: [chat_render, messages_render]
  # render_pins are not declared: an undeclared pin skips, and a placeholder would certainly
  # fail. They are added from the first run's evidence.
