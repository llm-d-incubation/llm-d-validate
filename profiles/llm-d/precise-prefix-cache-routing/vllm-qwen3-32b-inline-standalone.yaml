# The precise-prefix-cache-routing guide in standalone mode (the client reaches the EPP's own
# listener):
# vLLM serving Qwen/Qwen3-32B with no parsers: inline <think>, no tool calls (ROCm build).
#
# STATUS: WRITTEN, NOT RUN. llm-d 9ca8ff0.
#
# CI lane that deploys this configuration (llm-d's nightly-e2e-precise-prefix-cache-routing-<lane>
# workflow; it runs in standalone mode, gateway_class epponly):
#   amd-ci-acc-rocm-vllm-x            amd/vllm (the lane sets no provider, so it applies that
#                                     folder's own kustomization, which includes `base`)
# Identity flags per lane:
#   amd-ci-acc-rocm-vllm-x            --identity accelerator=amd --identity provider=base
#
# vllm-openai-rocm v0.31.0 with --enable-scale-out, --block-size=64 and --kv-events-config
# (FROM values: modelserver/amd/vllm/base/patch-vllm.yaml).
#
# How a lane runs it, after deploying the guide in standalone mode (guide.yaml deploy.standalone)
# with one of the overlays above (GUIDE_NAME=precise-prefix-cache-routing):
#   export LLMDV_EPP_URL=<the EPP's URL>
#   llmdv profile validate profiles/llm-d/precise-prefix-cache-routing/vllm-qwen3-32b-inline-standalone.yaml
#   llmdv verify --profile profiles/llm-d/precise-prefix-cache-routing/vllm-qwen3-32b-inline-standalone.yaml \
#     <the lane's identity flags above>

extends:
  - ../parts/base.yaml
  - ../parts/topology/standalone.yaml
  - ../parts/engines/vllm.yaml
  - ../parts/models/qwen3-32b-inline.yaml
  - ../parts/sentinels/unmeasured.yaml
  - parts/common.yaml

name: precise-prefix-cache-routing-vllm-qwen3-32b-inline-standalone

ingresses:
  # Overrides ../parts/topology/standalone.yaml on purpose: this lane's engine runs with
  # --enable-scale-out (FROM values: modelserver/amd/vllm/base/patch-vllm.yaml), and vLLM v0.30
  # and later register the four render routes only with that flag (FROM docs:
  # vllm@v0.31.0:vllm/entrypoints/scale_out/factories.py, register_scale_out_api_routers; the
  # routes in vllm/entrypoints/scale_out/render/api_router.py). Through the EPP, the router claims
  # the chat, completions and messages render routes (FROM docs: llm-d-router
  # parsers/openai/openai.go:133 and anthropic.go:69) and passes
  # /v1/responses/render through; it does not re-tokenize a client's render call (the
  # token-producer returns early for one) and routes it by model to one pod. Declared here, not
  # in parts/common.yaml, because the TPU v5p lane's engine runs without the flag.
  - id: epp
    surfaces: [chat_completions, completions, messages, responses, chat_render, completions_render, messages_render, responses_render]

capabilities:
  # INTENT: the router looks its cache up by the token prefix it renders, so a prompt that grows
  # by one turn must keep the earlier turns' tokens. A synthetic check.
  prefix_stability: [chat_render, messages_render]
  # render_pins are not declared: an undeclared pin skips, and a placeholder would certainly
  # fail. They are added from the first run's evidence.
