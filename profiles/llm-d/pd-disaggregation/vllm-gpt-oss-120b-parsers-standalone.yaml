# The pd-disaggregation guide in standalone mode (the client reaches the EPP's own listener):
# vLLM serving openai/gpt-oss-120b with the openai_gptoss reasoning parser and the openai
# tool parser, at the model's own window.
#
# llm-d 9ca8ff0. Composed from the guide's shipped config and the API
# references. Only the router layer has been measured (on kind, with a simulator engine and
# optimized-baseline's router values; see ../parts/topology/standalone.yaml).
#
# Prefill and decode run the same model id, window and parser flags (FROM values: both roles of
# each overlay below); the decode pod's routing sidecar returns one response per request.
#
# CI lanes that deploy this configuration (llm-d's nightly-e2e-pd-disaggregation-<lane>
# workflows; each runs in standalone mode, gateway_class epponly):
#   gke-acc-gpu-vllm-x                gpu/vllm/gke/base        vllm-openai v0.31.0
#   cks-acc-gpu-vllm-x                gpu/vllm/coreweave       vllm-openai v0.31.0
#   ibm-acc-gpu-vllm-x                gpu/vllm/ocp             vllm-openai v0.31.0 (`ocp` is not
#                                                              among guide.yaml's gpu providers)
#   amd-ci-acc-rocm-vllm-nixl         amd/vllm/nixl/amd-ci     vllm-openai-rocm v0.31.0
# The provider overlays change node, cache, RDMA and NIXL settings, not the engine's
# client-visible arguments; the AMD overlay adds --kv-cache-memory-bytes. The two accelerators run
# the same vLLM release, so their runs are worth comparing with llmdv compare.
#
# How a lane runs it, after deploying the guide in standalone mode (guide.yaml deploy.standalone)
# with one of the overlays above:
#   export LLMDV_ROUTER_URL=<the EPP's URL>
#   llmdv profile validate profiles/llm-d/pd-disaggregation/vllm-gpt-oss-120b-parsers-standalone.yaml
#   llmdv verify --profile profiles/llm-d/pd-disaggregation/vllm-gpt-oss-120b-parsers-standalone.yaml \
#     --identity accelerator=<ACCELERATOR_TYPE> --identity provider=<INFRA_PROVIDER>
# with the values each lane above lists (README.md beside this file).

extends:
  - ../parts/base.yaml
  - ../parts/topology/standalone.yaml
  - ../parts/engines/vllm.yaml
  - ../parts/models/gpt-oss-120b-parsers.yaml
  - ../parts/sentinels/unmeasured-with-tools.yaml
  - parts/common.yaml

name: pd-disaggregation-vllm-gpt-oss-120b-parsers-standalone

model:
  # FROM values: the overlays' own flag values, on both roles. The model part declares the shape
  # a client sees; the names belong to the engine, so they are stated here.
  reasoning:
    parser: openai_gptoss
    # Inferred from another deployment (vLLM 0.32 behind an llm-d router, a different model),
    # where the field is `reasoning`, and `reasoning_content` is absent. Not yet observed on this guide's
    # vLLM v0.31.0 with gpt-oss; the first run settles it.
    field: reasoning
  tools:
    parser: openai
