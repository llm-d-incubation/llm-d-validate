# Part: what every pd-disaggregation profile shares. Not a profile on its own; a combination file
# beside this folder lists it last in `extends`. Never extends anything.
#
# G = guides/pd-disaggregation, R = guides/recipes, at llm-d 9ca8ff0.
#
# No `name` here: the guide spans several combinations (engine and model configuration), and each
# run must say which one it was. The combination file names itself.
#
# The request path, as this guide deploys it (FROM values and FROM docs: G/README.md "Overview"):
# the client calls the EPP's listener (`<GUIDE_NAME>-epp`, port 80); the EPP schedules each request
# twice, once onto a prefill pod and once onto a decode pod, and forwards it to the decode pod's
# routing sidecar (port 8000), which runs the prefill on the prefill pod, then the decode on its
# own engine (port 8200), and returns one response. Prefill and decode are separate engines, but
# in every overlay a lane runs they carry the same model id, window and parser flags, so the
# client sees one model. Nothing about this path changes what a correct API returns, so every
# behaviour line is the same INTENT as in optimized-baseline; a field or option the sidecar drops
# or mangles on its way to either engine fails its case, which is the measurement.
#
# The router, as this guide configures it (FROM values: G/router/pd-disaggregation.values.yaml):
# always-disagg-pd-decider with disagg-profile-handler; profile `prefill` = prefill-filter,
# prefix-cache-affinity-filter (peakPrefillThroughput 33821), token-load-scorer, max-score-picker;
# profile `decode` = decode-filter, active-request-scorer, max-score-picker;
# approx-prefix-cache-producer with maxPrefixTokensToMatch 131072; one EPP replica. R/router/
# base.values.yaml supplies the rest (InferencePool failureMode FailOpen, an Envoy sidecar), as
# for optimized-baseline. No plugin names an SLO admission plugin, so the topology part's
# `ignored` SLO headers stand. The router facts in ../../parts/topology/standalone.yaml were
# measured with optimized-baseline's plugins; none of them depends on the scheduling profile.
#
# Block sizes, for when the cache suite or routing.prefix_affinity can use them (FROM values,
# both roles): gpu and amd vLLM --block-size=128; xpu vLLM --block-size=64; SGLang --page-size=64;
# tpu/v5p vLLM and the AMD MoRI-IO overlay the engine default. No router override in any lane
# (G/router/tpu-v7.values.yaml and npu.rbln.values.yaml belong to accelerators no lane runs).
#
# The guide's claims (G/README.md "Verification" and G/guide.yaml verify) and where each one
# lands. Router claims this guide shares with optimized-baseline (header handling, the EPP's HTTP
# APIs, streaming, FailOpen, gateway mode) map as in ../../optimized-baseline/parts/common.yaml.
#   1      /v1/completions answers 200 for ${MODEL} (verify.tests.request)
#          -> openai_completions.* and discovery.models_lists_declared_model
#   2      five ~1k-token /v1/completions requests with max_tokens 16 each answer 200
#          (verify.tests.pd_requests)
#          -> the HTTP status of that shape: openai_completions.* and long_context.* send longer
#             prompts through the same path. Not a dedicated case
#   3      each such request is prefilled on a prefill pod (prefill vllm:request_success_total
#          grows; SGLang sglang:num_requests_total) and its KV cache reaches the decode pod
#          (decode vllm:external_prefix_cache_hits_total grows by about the prompt length; SGLang
#          sglang:prompt_tokens_total on both roles) (verify.tests.pod_metrics)
#          -> NOT COVERED: needs per-role pod metrics read before and after, which needs replica
#             sets and cluster reads a committed profile does not carry (#24, fleet.metrics). No
#             response says which pod prefilled it: the README itself notes a decode sidecar can
#             serve a request end to end on its own, so a 200 proves nothing about the split
#   4      the router decides prefill-decode for each request (llm_d_epp_disagg_decision_total,
#          decision_type="prefill-decode"; verify.tests.router_metrics, MONITORING=true only)
#          -> NOT COVERED: EPP metrics, fleet.metrics, same reason; no lane sets MONITORING
#   5      prefix affinity on prefill, least in-flight requests on decode (README "Overview")
#          -> NOT COVERED: needs routing.prefix_affinity against the prefill role, per-pod counter
#             deltas (#27) and roles llmdv can tell apart (#24)
#   6      TTFT, ITL, pool utilization and KV-transfer stalls (README "Observability")
#          -> a benchmark or load mode (#23), not llmdv
#   7      each accelerator serves one model -> discovery.models_lists_declared_model,
#          discovery.unknown_model_no_fallback
#   8      context window and parsers per overlay -> long_context.*, unhappy.context_overflow and
#          model.reasoning / model.tools (model parts; parser names in each combination)
#   9      SGLang cancellation can strand a prefill's KV cache (README "vLLM vs SGLang")
#          -> NOT COVERED as a claim: streaming.* disconnect cases run, but a
#             stranded cache is visible only in the prefill pod's metrics
#   10     standalone endpoint `<GUIDE_NAME>-epp` on port 80 -> topology/standalone.yaml

guide: pd-disaggregation

capabilities:
  # Not declared, on purpose. The cache suite reads cached_tokens from each response, and no
  # overlay a lane runs asks an engine to report it: none passes vLLM's
  # --enable-prompt-tokens-details or SGLang's --enable-cache-report (FROM values: every lane's
  # rendered overlay). Only G/modelserver/tpu/v7/ passes them, a community overlay no lane runs.
  # With no cached_tokens, `affinity: routed` would fail on a correct stack for want of the field,
  # not for want of affinity. Claim 5 needs routing.prefix_affinity instead.
  cache_reuse: null

# The cases this guide's lanes run by default (`llmdv verify --all` runs everything). They test
# what a lane's own deployment can get wrong: the router path, the overlay's parsers and window,
# and what this guide changes. Engine and model conformance, the rest of the suite, depends only
# on the engine build, model and flags, which many lanes share; it runs with `--all` once per
# configuration (profiles/llm-d/README.md, "Which lane runs everything").
selection:
  # Every lane: the router serves each API a client uses, and refuses what it should.
  - contract.*
  - discovery.models_lists_declared_model
  - discovery.unknown_model_no_fallback
  - discovery.models_parses_with_openai_sdk
  - openai_chat.basic_non_streaming
  - openai_chat.streaming_sse
  - openai_chat.stop_reason
  - openai_completions.basic_non_streaming
  - openai_completions.streaming_matches_json
  - openai_completions.stop_reason
  - anthropic_messages.basic_non_streaming
  - anthropic_messages.streaming_sse
  - openai_responses.basic_non_streaming
  - openai_responses.streaming_sse
  - streaming.sse_framing
  - unhappy.unknown_path
  - unhappy.malformed_json
  - unhappy.missing_model
  - unhappy.wrong_method
  - unhappy.error_envelope_fields
  - transport.connection
  - transport.health_status
  # Every lane: the overlay's parser flags take effect (skips where the model part has none).
  - openai_chat.configured_reasoning
  - tools.auto_call
  - tools.auto_stream
  # Every lane: the overlay's context window is the one declared.
  - long_context.*
  - unhappy.context_overflow
  - unhappy.token_limit_over_context
  # This guide: every request passes the decode pod's routing sidecar: streaming, long prompts and
  # error paths through it.
  - openai_completions.prompt_forms
  - streaming.*
  - unhappy.invalid_token_limit
  - unhappy.streaming_validation
