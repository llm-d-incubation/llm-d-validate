# The keda-epp guide's llm-d router in standalone mode (the client reaches the EPP's own
# listener, with flow control on): vLLM serving Qwen/Qwen3-32B with no parsers: inline <think>,
# no tool calls, autoscaled by KEDA between one and two replicas.
#
# STATUS: WRITTEN, NOT RUN. llm-d 9ca8ff0. Composed from the guide's shipped config and the API
# references. Only the router layer has been measured, and that with optimized-baseline's router
# config (on kind, with a simulator engine; see ../parts/topology/standalone.yaml).
#
# CI lanes that deploy this configuration (llm-d's nightly-e2e-workload-autoscaling-keda-epp-<lane>
# workflows; standalone mode, with a custom_deploy_script):
#   amd-acc-rocm-vllm-x  reusable-nightly-e2e-amd,
#                        guides/workload-autoscaling/scripts/nightly-deploy-amd-keda-epp.sh:
#                        guides/optimized-baseline/modelserver/amd/vllm/base
#                        (vllm-openai-rocm v0.31.0), flow control on, queue ScaledObject;
#                        Service <release>-rocm-epp
#
# How a lane runs it, after the deploy script:
#   export LLMDV_EPP_URL=http://<release>-rocm-epp.<namespace>.svc.cluster.local
#   # or from outside the cluster:
#   #   kubectl port-forward -n <namespace> svc/<release>-rocm-epp 18080:80 &
#   #   export LLMDV_EPP_URL=http://localhost:18080
#   llmdv profile validate profiles/llm-d/keda-epp/vllm-qwen3-32b-inline-standalone.yaml
#   llmdv verify --profile profiles/llm-d/keda-epp/vllm-qwen3-32b-inline-standalone.yaml \
#     --identity accelerator=amd --identity provider=base

extends:
  - ../parts/base.yaml
  - ../parts/topology/standalone.yaml
  - ../parts/engines/vllm.yaml
  - ../parts/models/qwen3-32b-inline.yaml
  - ../parts/sentinels/unmeasured.yaml
  - parts/common.yaml

name: keda-epp-vllm-qwen3-32b-inline-standalone
