# The keda-epp guide's llm-d router in standalone mode (the client reaches the EPP's own
# listener): vLLM serving Qwen/Qwen3-32B with the qwen3 reasoning parser and the hermes tool
# parser, autoscaled by KEDA between one and two replicas.
#
# STATUS: WRITTEN, NOT RUN. llm-d 9ca8ff0. Composed from the guide's shipped config and the API
# references. Only the router layer has been measured, and that with optimized-baseline's router
# config (on kind, with a simulator engine; see ../parts/topology/standalone.yaml).
#
# CI lanes that deploy this configuration (llm-d's nightly-e2e-workload-autoscaling-keda-epp-<lane>
# workflows; standalone mode, each with a custom_deploy_script):
#   gke-acc-gpu-vllm-x   reusable-nightly-e2e-gke,
#                        guides/workload-autoscaling/scripts/nightly-deploy-gke-keda-epp.sh:
#                        guides/optimized-baseline/modelserver/gpu/vllm/gke, flow control on,
#                        queue ScaledObject; Service <release>-gke-epp
#   ibm-acc-gpu-vllm-x   reusable-nightly-e2e-openshift,
#                        guides/workload-autoscaling/scripts/nightly-deploy-ocp-keda-epp.sh:
#                        guides/optimized-baseline/modelserver/gpu/vllm/base, no flow control,
#                        inflight ScaledObject; Service <release>-inflight-epp. The workflow also
#                        passes image_override docker.io/vllm/vllm-openai:nightly to the
#                        reusable workflow, whose effect is outside this repository
# Their router configurations differ only under contention, and their providers differ, so they
# share this combination without a flavor.
#
# How a lane runs it, after the deploy script (Service as listed above):
#   export LLMDV_EPP_URL=http://<release>-<gke|inflight>-epp.<namespace>.svc.cluster.local
#   # or from outside the cluster:
#   #   kubectl port-forward -n <namespace> svc/<service> 18080:80 &
#   #   export LLMDV_EPP_URL=http://localhost:18080
#   llmdv profile validate profiles/llm-d/keda-epp/vllm-qwen3-32b-parsers-standalone.yaml
#   llmdv verify --profile profiles/llm-d/keda-epp/vllm-qwen3-32b-parsers-standalone.yaml \
#     --identity accelerator=gpu --identity provider=<gke|base>

extends:
  - ../parts/base.yaml
  - ../parts/topology/standalone.yaml
  - ../parts/engines/vllm.yaml
  - ../parts/models/qwen3-32b-parsers.yaml
  - ../parts/sentinels/unmeasured-with-tools.yaml
  - parts/common.yaml

name: keda-epp-vllm-qwen3-32b-parsers-standalone

model:
  # FROM values: the overlays' own flag values (--reasoning-parser=qwen3,
  # --tool-call-parser=hermes). The model part declares the shape a client sees; the names
  # belong to the engine, so they are stated here.
  reasoning:
    parser: qwen3
    # Inferred from another deployment (vLLM 0.32 behind an llm-d router), where the field is
    # `reasoning`, and `reasoning_content` is absent. Not yet observed on this guide's vLLM
    # builds; the first run settles it.
    field: reasoning
  tools:
    parser: hermes
