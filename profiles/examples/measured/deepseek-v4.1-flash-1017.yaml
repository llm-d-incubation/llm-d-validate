# deepseek-ai/DeepSeek-V4.1-Flash-1017, served by llm-d. Measured on real deployments of each layer below.
#
# Every surface, error status, capability and header is what that layer served, and the
# change sentinels (prompt_pins, render_pins, contract_baseline) are the values measured there.
# The client cases drive the runner image's Claude Code, 2.1.330 at /usr/local/bin/claude; these
# layers were measured with 2.1.289. Outside the image, install 2.1.330 there (see README.md), or
# leave the client cases out with -m "not real_clients".
# A plain run selects every case (test_sets.default is "*"). Point it at any deployment of
# the model, production or staging, with variables; nothing else changes:
#
#   export LLMDV_GATEWAY_URL=<the gateway's base URL> LLMDV_GATEWAY_KEY=<a key>
#   export LLMDV_GATEWAY_MODEL=<the id the gateway serves the model as>   # optional; default above
#
#   llmdv verify --profile <this file>
#
# A deployment that differs (another error status, another path) is a short file that
# extends this one and changes only that.

