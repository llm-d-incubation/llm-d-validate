  x-request-id: {litellm: ignored}
clients:
- id: smoke
  surfaces: [chat_completions]
  needs: [streaming]
- id: claude-code
  surfaces: [messages]
  needs: [streaming]
  binaries:
  - {version: "2.1.330", executable: /usr/local/bin/claude}
test_sets:
  default: ['*']
known_failures:
- check: field_status
  cases: ['openai_chat.request_field[logprob_token_ids]', 'openai_completions.request_field[logprob_token_ids]']
  ingress: litellm
  issue: vllm-project/vllm#61219
  fix: vllm-project/vllm#61219, vllm-project/vllm#44727
