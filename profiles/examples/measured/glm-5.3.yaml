# zai-org/GLM-5.3, served by llm-d. Measured on real deployments of each layer below.
#
# Every surface, error status, capability and header is what that layer served, and the
# change sentinels (prompt_pins, render_pins, contract_baseline) are the values measured there.
# The client cases drive Claude Code 2.1.289, the version these layers were measured with, from
# /opt/claude-code/2.1.289/claude; the runner image's /usr/local/bin/claude is another version.
# Install it there (see README.md), or leave the client cases out with -m "not real_clients".
# A plain run selects every case (test_sets.default is "*"). Point it at any deployment of
# the model, production or staging, with variables; nothing else changes:
#
#   export LLMDV_GATEWAY_URL=<the gateway's base URL> LLMDV_GATEWAY_KEY=<a key>
#   export LLMDV_GATEWAY_MODEL=<the id the gateway serves the model as>   # optional; default above
#   export LLMDV_ROUTER_URL=<the router's base URL>
#   export LLMDV_ROUTER_MODEL=<the id the router serves>             # optional
#
#   llmdv verify --profile <this file> --ingress litellm   # the gateway
#   llmdv verify --profile <this file> --ingress router    # the router
#   llmdv verify --profile <this file>                     # both
#
# A deployment that differs (another error status, another path) is a short file that
# extends this one and changes only that.

schema: llmdv.profile/1
name: measured-glm-5.3
vantage: external
fleet_policy: dedicated
model:
  public_id: zai-org/GLM-5.3
  aliases: []
  max_model_len: 1048576
  reasoning: {parser: glm45, field: reasoning_content, default_on: true}
  tools:
    parser: glm47
    auto_choice: true
    markup: [<tool_call>, <arg_key>, <arg_value>]
    strict_level: function
  answer_max_tokens: 128
ingresses:
- id: litellm
  kind: gateway
  base_url_env: LLMDV_GATEWAY_URL
  auth: {type: bearer, key_env: LLMDV_GATEWAY_KEY}
  health_path: /health/liveliness
  surfaces: [chat_completions, completions, messages, responses]
  timeouts: {connect: 10, request: 600, stream_idle: 120}
  error_status:
    unknown_model: [400, 403, 404]
    unknown_path: [404]
    wrong_method: [405]
    bad_credentials: [401]
    unsupported_option: [200]
    invalid_api_version: [400]
    image_input: [400]
    output_overflow: [200]
  unstructured_errors: []
  rate_limited: true
  setup: {proxy: allow}
  transport:
    health_status: [200]
    present_paths: [/v1/models, /openapi.json]
    absent_paths: [/docs, /tokenize, /detokenize, /metrics, /version]
    absent_status: [403, 404]
    cors_preflight: allowed
    alpn: h2
    http_redirect: expected
    credential_headers: [x-api-key, api-key]
    idempotency: ignored
    stream_budget: {first_event_s: 30, max_gap_s: 15, min_tokens_per_s: 5, next_request_s: 60}
  capabilities:
    model_info:
      supported_endpoints: [/v1/messages, /v1/chat/completions]
      llm_d_headers: true
      litellm_provider: hosted_vllm
  model: {public_id_env: LLMDV_GATEWAY_MODEL}
- id: router
  kind: router
  base_url_env: LLMDV_ROUTER_URL
  auth: {type: none}
  health_path: /health
  surfaces: [chat_completions, completions, messages, responses]
  timeouts: {connect: 10, request: 600, stream_idle: 120}
  error_status:
