    unknown_path: [404]
    wrong_method: [405]
    unsupported_option: [200]
    invalid_api_version: [400]
    image_input: [400]
    output_overflow: [200]
  unstructured_errors: []
  rate_limited: false
  transport:
    health_status: [200]
    present_paths: [/v1/models, /openapi.json, /docs, /metrics, /version]
    absent_paths: [/v1/model/info]
    absent_status: [404]
    cors_preflight: refused
    alpn: http/1.1
    idempotency: ignored
    stream_budget: {first_event_s: 30, max_gap_s: 15, min_tokens_per_s: 5, next_request_s: 60}
  model: {public_id_env: LLMDV_ROUTER_MODEL}
  capabilities:
    cache_reuse: {canonical_tool_keys: false}
    prompt_pins:
      chat_completions: {tools: 196}
      messages: {tools: 196}
      responses: {tools: 196}
