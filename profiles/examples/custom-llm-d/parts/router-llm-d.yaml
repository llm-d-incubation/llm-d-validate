# The llm-d router layer, reached directly, as GLM-5.3's and Muse's stacks served it. MEASURED on
# one deployment of each. Its URL and the model id it serves come from variables
# (LLMDV_ROUTER_URL, LLMDV_ROUTER_MODEL); it needs no key. What one stack's router serves
# differently is in that combination. A part, never run on its own.
ingresses:
- id: router
  kind: router
  base_url_env: LLMDV_ROUTER_URL
  auth: {type: none}
  health_path: /health
  timeouts: {connect: 10, request: 600, stream_idle: 120}
  error_status:
    unknown_model: [404]
    unknown_path: [404]
    wrong_method: [405]
    unsupported_option: [200]
    invalid_api_version: [400]
    output_overflow: [200]
  unstructured_errors: []
  rate_limited: false
  transport:
    health_status: [200]
    present_paths: [/v1/models, /openapi.json, /docs, /metrics, /version]
    absent_paths: [/v1/model/info]
    absent_status: [404]
    cors_preflight: refused
    idempotency: ignored
    stream_budget: {first_event_s: 30, max_gap_s: 15, min_tokens_per_s: 5, next_request_s: 60}
  model: {public_id_env: LLMDV_ROUTER_MODEL}
