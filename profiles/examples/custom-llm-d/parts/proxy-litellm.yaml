# The LiteLLM gateway layer, as every stack in this folder served it. MEASURED on one deployment
# of each. Its URL, key and the model id it serves come from variables (LLMDV_GATEWAY_URL,
# LLMDV_GATEWAY_KEY, LLMDV_GATEWAY_MODEL). What one stack's gateway serves differently is in that
# combination. A part, never run on its own.
ingresses:
- id: litellm
  kind: gateway
  base_url_env: LLMDV_GATEWAY_URL
  auth: {type: bearer, key_env: LLMDV_GATEWAY_KEY}
  health_path: /health/liveliness
  surfaces: [chat_completions, completions, messages, responses]
  timeouts: {connect: 10, request: 600, stream_idle: 120}
  error_status:
    unknown_path: [404]
    wrong_method: [405]
    bad_credentials: [401]
    unsupported_option: [200]
    invalid_api_version: [400]
    output_overflow: [200]
  unstructured_errors: []
  rate_limited: true
  setup: {proxy: allow}
  transport:
    health_status: [200]
    absent_status: [403, 404]
    cors_preflight: allowed
    alpn: h2
    http_redirect: expected
    credential_headers: [x-api-key, api-key]
    idempotency: ignored
    stream_budget: {first_event_s: 30, max_gap_s: 15, min_tokens_per_s: 5, next_request_s: 60}
  capabilities:
    model_info:
      supported_endpoints: [/v1/messages, /v1/chat/completions]
      llm_d_headers: true
      litellm_provider: hosted_vllm
  model: {public_id_env: LLMDV_GATEWAY_MODEL}
