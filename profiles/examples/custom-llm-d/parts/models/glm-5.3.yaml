# zai-org/GLM-5.3: the model as a client sees it (id, window, parsers, reasoning, tools) and the
# capabilities that differ from the other stacks in this folder. MEASURED on one deployment. A
# part, never run on its own.
model:
  public_id: zai-org/GLM-5.3
  aliases: []
  max_model_len: 1048576
  reasoning: {parser: glm45, field: reasoning_content, default_on: true}
  tools:
    parser: glm47
    auto_choice: true
    markup: [<tool_call>, <arg_key>, <arg_value>]
    strict_level: function
  answer_max_tokens: 128
capabilities:
  chat_reasoning_efforts: [high, max]
  chat_quiet_efforts: [low]
  effort_rendering:
    pattern: 'Reasoning Effort: (\w+)'
    efforts:
      unset: Max
      none: Low
      minimal: Low
      low: Low
      medium: Low
      high: High
      xhigh: Max
      max: Max
  chat_fields: {role_function: accepted}
  completions_fields: {suffix: accepted}
  image_url_fixture: https://www.python.org/static/img/python-logo.png
  messages_features: {image_url: accepted}
  client_sessions: [skill, hook, parallel_reads, nested_subagent, compaction]
  responses_reasoning_efforts: [minimal, low, medium, high, xhigh, max]
  responses_features: {encrypted_reasoning: accepted}
  extension_options:
  - ignore_eos
  - min_tokens
  - truncate_prompt_tokens
  - cache_salt
  - include_stop_str_in_output
  - continue_final_message
  - echo
  - continuous_usage_stats
  - structured_outputs
  - return_tokens_as_token_ids
  - prompt_logprobs
  - allowed_token_ids
  - bad_words
  - include_reasoning
  - stop_reason
  - chat_template_kwargs
  - return_token_ids
  - logit_bias
  messages_thinking: [enabled, adaptive]
headers:
  x-request-id: {router: ignored}
