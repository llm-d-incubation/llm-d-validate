# zai-org/GLM-5.3 on a custom llm-d stack: a LiteLLM gateway (`litellm`) in front of the llm-d
# router (`router`) in front of vLLM. MEASURED on one deployment of each layer: every surface,
# error status, capability and header the parts below declare is what that layer served, and so
# are the change sentinels in parts/sentinels/glm-5.3.yaml.
#
# Validation scope: the default selects the existing library before applicability gates.
# Start with smoke at a reachable ingress, then review the default plan (see README.md).
# Load LLMDV_GATEWAY_KEY from your credential store; do not put its value in shell history.
#   export LLMDV_GATEWAY_URL='https://your-gateway.example'
#   llmdv plan --profile profiles/examples/custom-llm-d/glm-5.3.yaml --ingress litellm --test-set smoke
#   llmdv verify --profile profiles/examples/custom-llm-d/glm-5.3.yaml --ingress litellm --test-set smoke
# LLMDV_GATEWAY_MODEL can supply the model ID that gateway serves. Configure each additional
# ingress before omitting --ingress; README.md lists endpoint variables and client prerequisites.
# The client pin is the runner's Claude Code 2.1.330 at /usr/local/bin/claude.
# Original measurements used 2.1.289; current live-validation status is recorded in README.md.
#
# This file holds only what is this stack's own: its cache settings (block size, the settings that
# render alike) and what each layer serves differently from the shared layer parts.
extends:
  - parts/base.yaml
  - parts/proxy-litellm.yaml
  - parts/router-llm-d.yaml
  - parts/models/glm-5.3.yaml
  - parts/known-failures/glm-5.3.yaml
  - parts/sentinels/glm-5.3.yaml
name: custom-llm-d-glm-5.3
capabilities:
  cache_reuse:
    min_ratio: 0.9
    cold_max_ratio: 0.1
    prefix_words: 2048
    block_size: 512
    withheld_blocks: 1
    surfaces: [chat_completions, responses, messages]
    affinity: routed
    canonical_tool_keys: true
    equivalent_settings: [['chat_completions:low', 'messages:disabled'], ['chat_completions:low', 'responses:low'],
      ['chat_completions:medium', 'messages:enabled:2048'], ['chat_completions:medium', 'responses:medium']]
ingresses:
- id: litellm
  error_status:
    unknown_model: [400, 403, 404]
    image_input: [400]
  transport:
    present_paths: [/v1/models, /openapi.json]
    absent_paths: [/docs, /tokenize, /detokenize, /metrics, /version]
- id: router
  surfaces: [chat_completions, completions, messages, responses]
  error_status:
    image_input: [400]
  transport: {alpn: http/1.1}
  capabilities:
    cache_reuse: {canonical_tool_keys: false}
    prompt_pins:
      chat_completions: {tools: 196}
      messages: {tools: 196}
      responses: {tools: 196}
