# meta-models/Muse-Spark-Open-816B-A42B-NVFP4 on a custom llm-d stack: a LiteLLM gateway
# (`litellm`) in front of the llm-d router (`router`) in front of vLLM. MEASURED on one deployment
# of each layer: every surface, error status, capability and header the parts below declare is
# what that layer served, and so are the change sentinels in
# parts/sentinels/muse-spark-open-816b-nvfp4.yaml, except its contract_baseline, which is not
# seeded yet (the llmdv_seed placeholder; see README.md).
#
# Validation scope: the default selects the existing library before applicability gates.
# Start with smoke at a reachable ingress, then review the default plan (see README.md).
# Load LLMDV_GATEWAY_KEY from your credential store; do not put its value in shell history.
#   export LLMDV_GATEWAY_URL='https://your-gateway.example'
#   llmdv plan --profile profiles/examples/custom-llm-d/muse-spark-open-816b-nvfp4.yaml --ingress litellm --test-set smoke
#   llmdv verify --profile profiles/examples/custom-llm-d/muse-spark-open-816b-nvfp4.yaml --ingress litellm --test-set smoke
# LLMDV_GATEWAY_MODEL can supply the model ID that gateway serves. Configure each additional
# ingress before omitting --ingress; README.md lists endpoint variables and client prerequisites.
# The client pin is the runner's Claude Code 2.1.330 at /usr/local/bin/claude.
# Original measurements used 2.1.289; current live-validation status is recorded in README.md.
#
# This file holds only what is this stack's own: its cache settings (block size, the settings that
# render alike) and what each layer serves differently from the shared layer parts.
extends:
  - parts/base.yaml
  - parts/proxy-litellm.yaml
  - parts/router-llm-d.yaml
  - parts/models/muse-spark-open-816b-nvfp4.yaml
  - parts/known-failures/muse-spark-open-816b-nvfp4.yaml
  - parts/sentinels/muse-spark-open-816b-nvfp4.yaml
name: custom-llm-d-muse-spark-open-816b-nvfp4
capabilities:
  cache_reuse:
    min_ratio: 0.9
    cold_max_ratio: 0.1
    prefix_words: 2048
    surfaces: [chat_completions, responses, messages]
    affinity: routed
ingresses:
- id: litellm
  error_status:
    unknown_model: [400, 403, 404]
  transport:
    present_paths: [/v1/models, /openapi.json, /metrics/]
    absent_paths: [/docs, /tokenize, /detokenize, /version]
- id: router
  surfaces:
  - chat_completions
  - completions
  - messages
  - responses
  - chat_render
  - completions_render
  - messages_render
  - responses_render
  model:
    reasoning: {field: reasoning}
  capabilities:
    model_retrieval: true
    prefix_stability:
    - chat_render
    - completions_render
    - messages_render
    - responses_render
    render_pins:
      completions_render: {conversation: 7e400f5aaa2ba61ec4a75b53611ef2de7ba34337202a1f07542ee634ba72eda7}
