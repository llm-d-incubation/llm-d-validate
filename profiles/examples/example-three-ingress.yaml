# Example: the full three-ingress shape, with LiteLLM in front.
#
# STATUS: A TEMPLATE. Values marked <...> are placeholders. The declarations show the shape of a
# stack with an engine, the llm-d router (EPP) and a LiteLLM proxy in front of both; replace each
# with what you measure on yours.
#
# A profile written from deployment manifests rather than from a running stack has lines that are
# wrong. Run `llmdv verify --profile <this file> -m contract` once the forwards are up: the
# contract suite exists to find them, and on a first run it is expected to.
#
# Where to read each layer's settings before you measure:
#   engine flags                  the reasoning and tool-call parsers; on a prefill/decode
#                                  split, check which role carries them
#   router configuration          the EPP Service and its port
#   LiteLLM configuration         model_list, authentication, keys and timeouts
schema: llmdv.profile/1
name: example-three-ingress
vantage: external

environment:
  cluster: <cluster>
  namespace: <namespace>
  # Set --context/--kubeconfig on the command line, or add `context:` and `kubeconfig:` here as
  # example-two-ingress.yaml does. A guessed context name is a line that silently never matches.

model:
  public_id: <org>/<model>
  aliases: []
  # Deliberately omitted: the engine runs --max-model-len ${MAX_MODEL_LEN:-auto}, so the real
  # value comes from GET /v1/models at runtime. Writing a number here would invent one.
  reasoning:
    # This fleet DOES have a parser, so reasoning arrives in its own field rather than inline --
    # the opposite of the two-ingress example. That is exactly why the shape is declared, not
    # assumed.
    parser: <reasoning-parser>
    field: reasoning_content
    default_on: true
  tools:
    parser: <tool-call-parser>
    auto_choice: true

ingresses:
  # Direct vLLM, decode role. On a prefill/decode split the roles can serve different ports
  # (here decode serves 8200) and only one may carry the reasoning and tool parsers. A case that
  # passes against decode and fails against prefill is a role asymmetry, not a gateway bug;
  # declare each role as its own ingress if you test both.
  - id: vllm
    kind: vllm
    base_url: http://localhost:18200
    auth: {type: none}
    health_path: /health
    surfaces: [chat_completions, completions, messages]
    timeouts: {connect: 5, request: 600, stream_idle: 60}
    error_status:
      unknown_model: [404]
    setup:
      proxy: bypass
      requires:
        - kind: port_forward
          namespace: <namespace>
          selector: llm-d.ai/role=decode
          local_port: 18200
          remote_port: 8200

  # The EPP. Clients drive the EPP Service (port 80 here), never a decode Service directly; the
  # direct engine ingress above is for comparison only.
  - id: router
    kind: llmd_router
    base_url: http://localhost:18080
    auth: {type: none}
    health_path: /health
    surfaces: [chat_completions, completions, messages]
    timeouts: {connect: 5, request: 900, stream_idle: 120}
    error_status:
      unknown_model: [404]
    setup:
      proxy: bypass
      requires:
        - kind: port_forward
          namespace: <namespace>
          target: svc/<epp-service>
          local_port: 18080
          remote_port: 80

  # LiteLLM. Here the only authenticating layer, and the only one whose model_list bounds what
  # is reachable. This one lists the model over its OpenAI provider only, so /v1/messages is
  # NOT exposed here even though the engine serves it.
  - id: litellm
    kind: litellm
    base_url: http://localhost:14000
    auth: {type: bearer, key_env: LLMDV_LITELLM_KEY}
    # A health path behind authentication can only ever answer 401 to a probe, which carries no
    # key. LiteLLM's /health/liveliness is auth-exempt; check that yours is.
    health_path: /health/liveliness
    surfaces: [chat_completions]
    # Match LiteLLM's own request_timeout. Long-context requests can take minutes under load, and
    # a client timeout that fires first cancels the request upstream, which looks like a fleet
    # failure and is not one.
    timeouts: {connect: 5, request: 3600, stream_idle: 120}
    error_status:
      unknown_model: [400, 404]
      bad_credentials: [401]
    setup:
      proxy: bypass
      requires:
        - kind: port_forward
          namespace: <namespace>
          target: svc/<litellm-service>
          local_port: 14000
          remote_port: 4000

capabilities:
  # Declared false until probed, so their cases skip as undeclared rather than assert against a
  # feature nobody has checked. /v1/responses is likewise left out of every ingress's surfaces
  # until it has been probed.
  count_tokens: false
  stateful_responses: false
  structured_output: false
  # Set for a multimodal model served with its vision path on; the image cases then run.
  vision: false
  vllm_options: []

headers:
  # This is the block that makes the three-ingress shape worth testing. In this example LiteLLM
  # is configured, by a pre-call hook, to drop the client's priority headers and set its own, and
  # not to forward client headers -- so the same header has three different dispositions
  # depending on where it enters. Declare what your proxy is configured to do.
  #
  # `rewritten` and `consumed` are NOT client-observable, so their cases will SKIP with
  # requires_instrumentation and requires_load. That is the honest outcome: proving LiteLLM
  # strips a privilege header needs an instrumented backend, and proving the EPP acted on a
  # priority band needs a load experiment. A green pass here would be a claim the evidence
  # does not support.
  x-llm-d-inference-objective:
    vllm: ignored
    router: consumed      # -> skip: requires_load
    litellm: rewritten    # -> skip: requires_instrumentation
  x-llm-d-inference-fairness-id:
    vllm: ignored
    router: consumed
    litellm: rewritten
  x-litellm-ratelimit-saturation:
    # The same hook drops this one too, and never accepts it from a client.
    litellm: rewritten
  x-request-id:
    vllm: ignored
    router: ignored
    litellm: ignored

clients:
  # An agent client that needs /v1/messages, which LiteLLM's model_list does not expose, is
  # NOT fully served through that ingress. `llmdv verify --client agent --ingress litellm` is
  # the command that states it.
  - id: agent
    surfaces: [chat_completions, messages]
    needs: [streaming, tools, reasoning]
  - id: tau2
    surfaces: [chat_completions]
    needs: [tools]
  - id: completions-probe
    surfaces: [completions]
    needs: []
